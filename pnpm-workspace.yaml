packages:
  - 'src/web'
  - 'tests/e2e'

# Delay newly published packages while registries and scanners surface
# compromised releases, and reject releases with weaker publisher trust.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# These exact legacy transitive versions predate npm provenance and are still
# required by consumers that declare semver 6 and Node 20 types. Their npm
# signatures and lockfile integrity remain verified; newer versions continue
# to be subject to the no-downgrade policy.
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
blockExoticSubdeps: true

onlyBuiltDependencies:
  - core-js
  - esbuild
  - unrs-resolver

allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true

patchedDependencies:
  '@semantic-ui-react/event-stack@3.1.3': patches/@semantic-ui-react__event-stack@3.1.3.patch
  # See ADR-0026. React 19 support comes from PR #49 at f48309b333505a3df02499d7c97cd2ebaef3d385.
  react-fomantic-ui@3.0.0-beta.5: patches/react-fomantic-ui@3.0.0-beta.5.patch

overrides:
  # Keep transitive releases outside the seven-day quarantine window.
  '@asamuzakjp/dom-selector': '10.0.3'
  'undici': '8.12.2'
  'brace-expansion@^1.1.0': '1.1.21'
  'brace-expansion@^5.0.0': '5.0.12'
  '@semantic-ui-react/event-stack@3.1.3>react': '^16.0.0 || ^17.0.0 || ^18.0.0 || ^19.0.0'
  '@semantic-ui-react/event-stack@3.1.3>react-dom': '^16.0.0 || ^17.0.0 || ^18.0.0 || ^19.0.0'
  'react-fomantic-ui@3.0.0-beta.5>@fluentui/react-component-event-listener': '-'
  'react-fomantic-ui@3.0.0-beta.5>react': '^18.0.0 || ^19.0.0'
  'react-fomantic-ui@3.0.0-beta.5>react-dom': '^18.0.0 || ^19.0.0'
  'react-popper>react': '^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0'
  'react-popper>react-dom': '^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0'
  'source-map-js@<1.2.2': '1.2.2'
  'follow-redirects': '1.16.1'
