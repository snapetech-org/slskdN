location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__;
    # This local HTTP/1.1 upstream uses WebSocket only; reject h2c and other upgrade protocols.
    # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling -- only the WebSocket protocol is forwarded to the loopback application.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    set $slskdn_upgrade "";
    set $slskdn_connection "";
    if ($http_upgrade ~* "^websocket$") {
        set $slskdn_upgrade "websocket";
        set $slskdn_connection "upgrade";
    }
    proxy_set_header Upgrade $slskdn_upgrade;
    proxy_set_header Connection $slskdn_connection;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
}
