app-id: io.github.slskd.slskdn
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: slskdn-wrapper

# Build configuration
build-options:
  cflags: -O2 -g
  cxxflags: -O2 -g
  env:
    - V=1

# Runtime requirements
finish-args:
  # Network access for Soulseek, mesh networking, and web features
  - --share=network
  # File system access for downloads and shares
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --filesystem=xdg-pictures
  - --filesystem=~/.slskdn:create
  - --filesystem=~/.config/slskdn:create
  - --filesystem=~/.cache/slskdn:create
  # System integration
  - --device=dri
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Portal access for file dialogs and notifications
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.Notifications
  # Allow Tor/I2P connectivity for privacy features
  - --talk-name=org.freedesktop.Avahi


# Modules to build
modules:
  # .NET runtime (10.0 for slskdN)
  - name: dotnet
    buildsystem: simple
    build-commands:
      - |
        mkdir -p /app/dotnet /app/bin
        cp -r . /app/dotnet/
        ln -sf /app/dotnet/dotnet /app/bin/dotnet
    sources:
      - type: archive
        url: https://builds.dotnet.microsoft.com/dotnet/Runtime/10.0.13/dotnet-runtime-10.0.13-linux-x64.tar.gz
        sha256: 958c952691d2c3f8ce21f717f4e911c02b5da0e21ead21bd576368c454b79c77

  # slskdN application
  - name: slskdn
    buildsystem: simple
    build-commands:
      - |
        # Create directories
        mkdir -p /app/bin /app/lib/slskdn
        mkdir -p /app/share/applications
        mkdir -p /app/share/icons/hicolor/scalable/apps
        mkdir -p /app/share/metainfo

        # Install slskdN (from slskdn-main-linux-glibc-x64.zip: slskd, slskd.dll, deps, wwwroot)
        cp slskd* /app/lib/slskdn/ 2>/dev/null || true
        cp *.dll /app/lib/slskdn/
        cp -r wwwroot /app/lib/slskdn/
        chmod +x /app/lib/slskdn/slskd 2>/dev/null || true

        # Create wrapper script
        cat > /app/bin/slskdn-wrapper << 'EOF'
        #!/bin/bash
        set -e

        # Set up directories
        export SLSKD_CONFIG="${XDG_CONFIG_HOME:-$HOME/.config}/slskdn/slskd.yml"
        export SLSKD_SHARED_DIR="${XDG_DOCUMENTS_DIR:-$HOME/Documents}/slskdn/shared"
        export SLSKD_DOWNLOADS_DIR="${XDG_DOWNLOAD_DIR:-$HOME/Downloads}/slskdn"
        export SLSKD_INCOMPLETE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/slskdn/incomplete"

        # Create directories if they don't exist
        mkdir -p "$(dirname "$SLSKD_CONFIG")"
        mkdir -p "$SLSKD_SHARED_DIR"
        mkdir -p "$SLSKD_DOWNLOADS_DIR"
        mkdir -p "$SLSKD_INCOMPLETE_DIR"

        # Generate default config if it doesn't exist
        if [ ! -f "$SLSKD_CONFIG" ]; then
            cat > "$SLSKD_CONFIG" << DEFAULT_CONFIG
        directories:
          incomplete: "$SLSKD_INCOMPLETE_DIR"
          downloads: "$SLSKD_DOWNLOADS_DIR"
          shared:
            - "$SLSKD_SHARED_DIR"
        web:
          url_base: /
          content_path: /app/lib/slskdn/wwwroot
        DEFAULT_CONFIG
        fi

        exec /app/lib/slskdn/slskd --config "$SLSKD_CONFIG"
        EOF
        chmod +x /app/bin/slskdn-wrapper

        install -Dm644 slskdn.desktop /app/share/applications/io.github.slskd.slskdn.desktop
        install -Dm644 slskdn.metainfo.xml.in /app/share/metainfo/io.github.slskd.slskdn.metainfo.xml
        install -Dm644 slskdn.svg /app/share/icons/hicolor/scalable/apps/io.github.slskd.slskdn.svg
    sources:
      # slskdN 2026101222-slskdn.350 Linux glibc x64 (snapetech; asset slskdn-main-linux-glibc-x64.zip)
      - type: archive
        url: https://github.com/snapetech/slskdn/releases/download/2026101222-slskdn.350/slskdn-main-linux-glibc-x64.zip
        sha256: dcd2ef16a3077d8df12c2260cec399f78ee306ca713b36158e69c154dc851541

      - type: file
        path: slskdn.desktop

      - type: file
        path: slskdn.metainfo.xml.in

      - type: file
        path: slskdn.svg
