name: slskdn
base: core22
version: '2026111723-slskdn.354'
summary: slskdN, an unofficial batteries-included fork of slskd
description: |
  slskdN is an unofficial fork of slskd with batteries-included Soulseek features:
  SongID, Discovery Graph, multi-source downloads, DHT mesh networking,
  auto-replace, wishlist, and security hardening.
grade: stable
confinement: strict
architectures:
  - amd64

apps:
  slskdn:
    command: slskd
    daemon: simple
    plugs: [network, network-bind, home, removable-media]
    environment:
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: $SNAP_USER_COMMON/.net

parts:
  slskdn:
    plugin: dump
    source: https://github.com/snapetech/slskdn/releases/download/v2026111723-slskdn.354/slskdn-main-linux-glibc-x64.zip
    source-checksum: sha256/78ebfb83318ac57e939a067e94e2b3f3fec7778a0e05dd9cf38da89b6e3913c8
    stage-packages:
      - libicu70
      - libssl3
