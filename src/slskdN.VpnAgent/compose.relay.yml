services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/slskdN-relay/relay.env
    volumes:
      - /etc/slskdN-relay:/etc/slskdN-relay:ro
      - /var/lib/slskdN-vpn:/var/lib/slskdN-vpn
      - /sys/class/net:/sys/class/net:ro
    command: ["relay-run"]
    restart: unless-stopped
