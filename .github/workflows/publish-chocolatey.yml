name: Publish Chocolatey

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag to publish, e.g. 2026090318-slskdn.318'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Chocolatey Stable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.version }}" `
            --repo ${{ github.repository }} `
            --pattern "slskdn-main-win-x64.zip"

      - name: Pack and Push
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) {
            Write-Error "CHOCO_API_KEY secret is not configured"
            exit 1
          }

          $Version = "${{ inputs.version }}"
          if ($Version -notmatch '^(\d{10})-slskdn\.(\d+)$') {
            Write-Error "Unsupported stable release version for Chocolatey: $Version"
            exit 1
          }
          $PackageVersion = "$($Matches[1]).0.0.$($Matches[2])"
          if ($PackageVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            Write-Error "Chocolatey package version is not numeric: $PackageVersion"
            exit 1
          }
          $Url = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/slskdn-main-win-x64.zip"
          $Checksum = (Get-FileHash slskdn-main-win-x64.zip -Algorithm SHA256).Hash
          (Get-Content packaging/chocolatey/slskdn.nuspec) -replace '<version>.*</version>', "<version>$PackageVersion</version>" | Set-Content packaging/chocolatey/slskdn.nuspec
          (Get-Content packaging/chocolatey/slskdn.nuspec) -replace '<releaseNotes>.*</releaseNotes>', "<releaseNotes>https://github.com/${{ github.repository }}/releases/tag/$Version</releaseNotes>" | Set-Content packaging/chocolatey/slskdn.nuspec
          (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1) -replace '\$url\s*=\s*".*"', "`$url = `"$Url`"" | Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1
          (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1) -replace '\$checksum\s*=\s*".*"', "`$checksum = `"$Checksum`"" | Set-Content packaging/chocolatey/tools/chocolateyinstall.ps1

          cd packaging/chocolatey
          choco pack

          $expectedNupkg = "slskdn.$PackageVersion.nupkg"
          $nupkg = Get-ChildItem -Filter $expectedNupkg -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nupkg) {
            Write-Error "Chocolatey produced no package named $expectedNupkg"
            exit 1
          }

          Write-Host "Created and validated: $($nupkg.Name)"
          $packageEndpoint = "https://community.chocolatey.org/api/v2/package/slskdn/$PackageVersion"
          function Test-ChocolateyPackage {
            try {
              $response = Invoke-WebRequest -Uri $packageEndpoint -Method Head -MaximumRedirection 5 -ErrorAction Stop
              return $response.StatusCode -eq 200
            } catch {
              return $false
            }
          }

          function Wait-ForChocolateyPackage {
            param(
              [int]$Attempts = 6,
              [int]$DelaySeconds = 10
            )

            for ($check = 1; $check -le $Attempts; $check++) {
              if (Test-ChocolateyPackage) {
                return $true
              }
              if ($check -lt $Attempts) {
                Start-Sleep -Seconds $DelaySeconds
              }
            }
            return $false
          }

          $maxRetries = 5
          for ($attempt = 1; $attempt -le $maxRetries; $attempt++) {
            if (Test-ChocolateyPackage) {
              Write-Host "Chocolatey already has slskdn $PackageVersion"
              exit 0
            }

            Write-Host "Pushing $($nupkg.Name) to Chocolatey (attempt $attempt/$maxRetries)"
            # Run from the package directory without a path argument; this avoids
            # Chocolatey v2/PowerShell gluing the path to the next option.
            $pushOutput = & choco push --source https://push.chocolatey.org/ --api-key "$env:CHOCO_API_KEY" --execution-timeout 300 2>&1
            $pushExitCode = $LASTEXITCODE
            $pushText = ($pushOutput | Out-String).Trim()
            Write-Host $pushText

            if ($pushExitCode -eq 0 -or $pushText -match "already exists|Package already exists|409") {
              if (Wait-ForChocolateyPackage) {
                Write-Host "Published to Chocolatey: slskdn $PackageVersion"
                exit 0
              }
              Write-Error "Chocolatey reported success but $packageEndpoint is not available"
              exit 1
            }

            if ($pushText -notmatch "504|Gateway Timeout|timeout") {
              Write-Error "choco push failed with exit code $pushExitCode"
              exit $pushExitCode
            }

            if (Test-ChocolateyPackage) {
              Write-Host "Chocolatey accepted slskdn $PackageVersion despite the push timeout"
              exit 0
            }

            if ($attempt -lt $maxRetries) {
              Start-Sleep -Seconds (30 * $attempt)
            }
          }

          Write-Error "Chocolatey push failed after $maxRetries attempts; exact package endpoint was not published"
          exit 1
        shell: pwsh
