# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Publish Winget

run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options: [publish-winget]
      runner_pool_tag:
        description: Runner pool
        required: true
        type: choice
        options: [private]
      version:
        description: 'Published release tag to submit, e.g. v2026042900-slskdn.202'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  submit:
    name: Submit Winget PR
    if: github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' && github.ref == 'refs/heads/main' && inputs.action_tag == 'publish-winget' && inputs.runner_pool_tag == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-submit"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Winget token
        env:
          WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGETCREATE_GITHUB_TOKEN)) {
            Write-Error "WINGETCREATE_GITHUB_TOKEN is not configured; Winget submission cannot open a PR against microsoft/winget-pkgs"
            exit 1
          }

      - name: Download wingetcreate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          Get-Item .\wingetcreate.exe | Format-List Name,Length,LastWriteTime

      - name: Download release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh release download "$env:RELEASE_TAG" `
            --repo "$env:REPOSITORY" `
            --pattern "slskdn-main-win-x64.zip"

      - name: Prepare stable manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseTag = $env:RELEASE_TAG
          $ReleaseVersion = $ReleaseTag -replace '^v', ''
          if ($ReleaseVersion -notmatch '^\d{10}-slskdn\.\d+$') {
            Write-Error "Expected stable release version like 2026042900-slskdn.202"
            exit 1
          }
          if ($ReleaseVersion -match '^(\d{10})-slskdn\.(\d+)$') {
            $WingetVersion = "$($Matches[1]).$($Matches[2])"
          } else {
            $WingetVersion = $ReleaseVersion.Replace('-', '.')
          }
          $InstallerUrl = "https://github.com/$env:REPOSITORY/releases/download/$ReleaseTag/slskdn-main-win-x64.zip"
          $InstallerSha = (Get-FileHash slskdn-main-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()

          bash packaging/scripts/update-winget-manifests.sh `
            stable `
            $ReleaseVersion `
            $InstallerUrl `
            $InstallerSha `
            $ReleaseVersion

          $WingetSubmitPath = Join-Path "winget-submit" "manifests/s/snapetech/slskdn/$WingetVersion"
          New-Item -ItemType Directory -Force $WingetSubmitPath | Out-Null
          Copy-Item packaging/winget/snapetech.slskdn.yaml $WingetSubmitPath/
          Copy-Item packaging/winget/snapetech.slskdn.installer.yaml $WingetSubmitPath/
          Copy-Item packaging/winget/snapetech.slskdn.locale.en-US.yaml $WingetSubmitPath/
          "WINGET_SUBMIT_PATH=$WingetSubmitPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Submit manifests to winget-pkgs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ReleaseVersion = $env:RELEASE_VERSION -replace '^v', ''
          if ($ReleaseVersion -notmatch '^\d{10}-slskdn\.\d+$') {
            Write-Error "Expected stable release version like 2026042900-slskdn.202, got '$ReleaseVersion'"
            exit 1
          }

          if ($ReleaseVersion -match '^(\d{10})-slskdn\.(\d+)$') {
            $WingetVersion = "$($Matches[1]).$($Matches[2])"
          } else {
            $WingetVersion = $ReleaseVersion.Replace('-', '.')
          }
          $InstallerUrl = "https://github.com/$env:REPOSITORY/releases/download/$ReleaseVersion/slskdn-main-win-x64.zip"

          Write-Host "Submitting Winget update for snapetech.slskdn"
          Write-Host "Release version: $ReleaseVersion"
          Write-Host "Winget version:  $WingetVersion"
          Write-Host "Installer URL:   $InstallerUrl"

          .\wingetcreate.exe submit $env:WINGET_SUBMIT_PATH `
            -t $env:WINGETCREATE_GITHUB_TOKEN
