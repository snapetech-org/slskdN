# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: Windows Smoke


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:smoke:pool:private:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'smoke', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'smoke', inputs.runner_pool || 'private') || format('action:smoke:pool:private') }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [smoke]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dotnet:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'smoke' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","slskdn","gha-{0}-dotnet"]}}', github.run_id)) }}
    env:
      DOTNET_VERSION: "10.0.x"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore slskd.sln -p:Version=0.0.0

      - name: Build
        run: dotnet build slskd.sln --configuration Release --no-restore -p:Version=0.0.0

      - name: Test
        run: dotnet test slskd.sln --configuration Release --no-build
