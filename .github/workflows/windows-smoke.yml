# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Windows Smoke

run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action_tag, inputs.runner_pool_tag, inputs.release_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options: [release]
      runner_pool_tag:
        description: Runner pool
        required: true
        type: choice
        options: [private]
      release_tag:
        description: Published release tag to smoke test
        required: true
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dotnet:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'snapetech' && github.ref == 'refs/heads/main' && inputs.action_tag == 'release' && inputs.runner_pool_tag == 'private' && inputs.release_tag != ''
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","slskdn","gha-{0}-dotnet"]}}', github.run_id)) }}
    env:
      DOTNET_VERSION: "10.0.x"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore slskd.sln -p:Version=0.0.0

      - name: Build
        run: dotnet build slskd.sln --configuration Release --no-restore -p:Version=0.0.0

      - name: Test
        run: dotnet test slskd.sln --configuration Release --no-build
