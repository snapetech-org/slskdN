name: Package Smoke Validation (disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version to validate"
        required: true
      channel:
        description: "Package channel to validate"
        required: true
        default: "github-archive"
      arch:
        description: "Target architecture label"
        required: true
        default: "amd64"

permissions:
  contents: read

jobs:
  package-smoke:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y bash ca-certificates curl jq unzip tar
      - name: Run package smoke
        run: packaging/smoke/package-smoke slskdn "${{ inputs.channel }}" "${{ inputs.version }}" --arch "${{ inputs.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-smoke-${{ inputs.channel }}-${{ inputs.arch }}
          path: artifacts/package-smoke/
