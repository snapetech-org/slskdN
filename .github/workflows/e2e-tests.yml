# ng-runner-policy: private-jit-only-v1
name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

  push:
    tags:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.402'
  NODE_VERSION: '22.23.4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
jobs:
  e2e:
    name: E2E Tests
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-e2e"]}}', github.run_id)) }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: src/web
        run: |
          pnpm --filter @slskdn/web build
          # Copy to wwwroot for serving (wwwroot is gitignored, create if missing)
          mkdir -p ../slskd/wwwroot
          rm -rf ../slskd/wwwroot/*
          cp -r build/* ../slskd/wwwroot/

      - name: Build Backend
        run: |
          # Web assets must be present before build so they are copied beside the E2E executable.
          # Use -p:Version=0.0.0 to avoid VERSION env var (if set) being read as an invalid MSBuild $(Version)
          dotnet build src/slskd/slskd.csproj -c Debug -p:Version=0.0.0

      - name: Fetch Test Fixtures
        run: |
          ./scripts/fetch-test-fixtures.sh
        continue-on-error: true  # Don't fail if network is down, static files are enough for basic tests

      - name: Install E2E Dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/slskdn-playwright-browsers
        run: |
          pnpm --filter @slskdn/e2e exec playwright install --with-deps chromium

      - name: Typecheck E2E Tests
        run: pnpm --filter @slskdn/e2e typecheck

      - name: Run E2E Tests
        run: pnpm --filter @slskdn/e2e test:e2e:ci
        env:
          SLSKDN_TEST_NO_CONNECT: true
          SLSKDN_TEST_KEEP_ARTIFACTS: ${{ github.event_name == 'workflow_dispatch' }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/slskdn-playwright-browsers
          TMPDIR: ${{ runner.temp }}

      - name: Upload Test Artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/test-results/
            ${{ runner.temp }}/slskdn-test-*/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
