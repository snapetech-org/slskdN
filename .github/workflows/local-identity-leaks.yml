# ng-runner-policy: private-jit-only-v1
name: Local Identity Leak Check

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the private security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pull-request-scan:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'scan' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name == 'pull_request'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-pull-request-scan"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout pull request content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: scanner
          sparse-checkout: |
            scripts/check-local-identity-leaks.sh
            scripts/install-scanner-tools.sh
          persist-credentials: false

      - name: Install trusted scanner tools
        run: bash scanner/scripts/install-scanner-tools.sh

      - name: Check pull request content with trusted scanner
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_ROOT: ${{ github.workspace }}/source
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
          LOCAL_IDENTITY_SCAN_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: bash scanner/scripts/check-local-identity-leaks.sh

  trusted-ref-scan:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-trusted-ref-scan"]}}', github.run_id)) }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify scanner runtime
        run: command -v python3

      - name: Check release-facing text on trusted refs
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
          LOCAL_IDENTITY_SCAN_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
          LOCAL_IDENTITY_SCAN_COMMIT_COUNT: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: bash scripts/check-local-identity-leaks.sh

