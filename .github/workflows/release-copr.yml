name: Upload to COPR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to COPR'
        required: true

permissions:
  contents: read
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION=$(echo "$TAG" | sed 's/-slskdn/.slskdn/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @slskdn/web build
          pnpm --filter @slskdn/web check:bundle

      - name: Build Backend
        run: |
          dotnet publish src/slskd/slskd.csproj \
            -c Release \
            -o publish-linux-x64 \
            --self-contained true \
            -r linux-x64 \
            -p:AllowMissingPrunePackageData=true

          dotnet publish src/slskdN.VpnAgent/slskdN-vpn-agent.csproj \
            -c Release \
            -o publish-linux-x64/vpn-agent \
            --self-contained true \
            -r linux-x64 \
            -p:PublishSingleFile=true
          cp src/slskdN.VpnAgent/README.md publish-linux-x64/vpn-agent/README.md
          cp src/slskdN.VpnAgent/GETTING_STARTED.md publish-linux-x64/vpn-agent/GETTING_STARTED.md
          cp src/slskdN.VpnAgent/manual-linux-wireguard.md publish-linux-x64/vpn-agent/manual-linux-wireguard.md
          cp src/slskdN.VpnAgent/external-tunnel.md publish-linux-x64/vpn-agent/external-tunnel.md
          cp src/slskdN.VpnAgent/self-hosted-relay.md publish-linux-x64/vpn-agent/self-hosted-relay.md
          cp src/slskdN.VpnAgent/windows-macos.md publish-linux-x64/vpn-agent/windows-macos.md
          cp src/slskdN.VpnAgent/api-contract.md publish-linux-x64/vpn-agent/api-contract.md
          cp docs/self-hosted-relay-tester-guide.md publish-linux-x64/vpn-agent/self-hosted-relay-tester-guide.md
          cp -r src/slskdN.VpnAgent/systemd publish-linux-x64/vpn-agent/
          cp -r src/slskdN.VpnAgent/examples publish-linux-x64/vpn-agent/
          cp src/slskdN.VpnAgent/Dockerfile.relay src/slskdN.VpnAgent/compose.relay.yml publish-linux-x64/vpn-agent/
          cp src/slskdN.VpnAgent/install.sh publish-linux-x64/vpn-agent/install.sh
          chmod +x publish-linux-x64/vpn-agent/slskdN-vpn-agent publish-linux-x64/vpn-agent/install.sh

      - name: Copy Web Assets
        run: |
          mkdir -p publish-linux-x64/wwwroot
          cp -r src/web/build/* publish-linux-x64/wwwroot/

      - name: Verify Publish Output
        run: |
          test -x publish-linux-x64/slskd || { echo 'missing slskd apphost'; exit 1; }
          test -x publish-linux-x64/vpn-agent/slskdN-vpn-agent || { echo 'missing VPN helper'; exit 1; }
          test -f publish-linux-x64/vpn-agent/systemd/slskdN-vpn-ingress.service || { echo 'missing VPN helper systemd units'; exit 1; }
          find publish-linux-x64 -name 'libcoreclrtraceptprovider.so' -print || true

      - name: Create Zip
        run: |
          cd publish-linux-x64
          zip -r ../slskdn-${{ steps.version.outputs.tag }}-linux-x64.zip .
          cd ..

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates krb5-user krb5-k5tls krb5-pkinit libkrb5-dev oathtool python3-pip rpm
          pip3 install copr-cli rich requests-gssapi

      - name: Configure COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config

          configure_fedora_kerberos() {
            sudo install -d -m 0755 /etc/pki/ipa
            curl -fsSL https://id.fedoraproject.org/ipa/config/ca.crt | sudo tee /etc/pki/ipa/fedoraproject_ipa_ca.crt >/dev/null
            sudo install -d -m 0755 /etc/krb5.conf.d
            if ! grep -Eq '^[[:space:]]*includedir[[:space:]]+/etc/krb5.conf.d/?[[:space:]]*$' /etc/krb5.conf; then
              sudo sed -i '1iincludedir /etc/krb5.conf.d/' /etc/krb5.conf
            fi
            sudo tee /etc/krb5.conf.d/fedoraproject_org >/dev/null <<'EOF'
          [realms]
           FEDORAPROJECT.ORG = {
            kdc = https://id.fedoraproject.org/KdcProxy
            pkinit_anchors = FILE:/etc/pki/ipa/fedoraproject_ipa_ca.crt
           }

          [domain_realm]
           .fedoraproject.org = FEDORAPROJECT.ORG
           fedoraproject.org = FEDORAPROJECT.ORG
           .fedorainfracloud.org = FEDORAPROJECT.ORG
           fedorainfracloud.org = FEDORAPROJECT.ORG
          EOF
            sudo sed -i '/^\[libdefaults\]/a\  dns_lookup_realm = false\n  rdns = false\n  dns_canonicalize_hostname = false' /etc/krb5.conf
          }

          if [[ -n "${COPR_LOGIN:-}" && -n "${COPR_TOKEN:-}" ]]; then
            echo "Configuring COPR with API token credentials."
            cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = slskdn
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          elif [[ -n "${COPR_KERBEROS_PRINCIPAL:-}" && -n "${COPR_KERBEROS_KEYTAB_B64:-}" ]]; then
            echo "Configuring COPR with Kerberos keytab credentials."
            configure_fedora_kerberos

            keytab="$RUNNER_TEMP/copr.keytab"
            ccache="$RUNNER_TEMP/copr.krb5cc"
            printf '%s' "$COPR_KERBEROS_KEYTAB_B64" | base64 -d > "$keytab"
            chmod 0600 "$keytab"
            KRB5CCNAME="FILE:$ccache" kinit -kt "$keytab" "$COPR_KERBEROS_PRINCIPAL"
            rm -f "$keytab"
            echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
            cat > ~/.config/copr << EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
          elif [[ -n "${COPR_FEDORA_USERNAME:-}" && -n "${COPR_FEDORA_PASSWORD:-}" && -n "${COPR_FEDORA_OTP_SECRET:-}" ]]; then
            echo "Configuring COPR with Fedora Kerberos password+OTP credentials."
            configure_fedora_kerberos
            ccache="$RUNNER_TEMP/copr.krb5cc"
            armor="$RUNNER_TEMP/copr.krb5cc.armor"
            otp="$(oathtool --totp --base32 "$COPR_FEDORA_OTP_SECRET")"
            KRB5CCNAME="FILE:$armor" kinit -n @FEDORAPROJECT.ORG
            printf '%s%s\n' "$COPR_FEDORA_PASSWORD" "$otp" \
              | KRB5CCNAME="FILE:$ccache" kinit -T "FILE:$armor" "${COPR_FEDORA_USERNAME}@FEDORAPROJECT.ORG"
            KRB5CCNAME="FILE:$armor" kdestroy || true
            echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
            cat > ~/.config/copr << EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
          else
            echo "COPR credentials not configured. Skipping."
          fi

      - name: Update spec version
        run: |
          sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.version }}/" packaging/rpm/slskdn.spec
          # Use local filename (not URL) so SRPM includes the file
          sed -i "s|^Source0:.*|Source0:        slskdn-${{ steps.version.outputs.tag }}-linux-x64.zip|" packaging/rpm/slskdn.spec
          cat packaging/rpm/slskdn.spec | head -20

      - name: Build SRPM
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          rpm_top="$(mktemp -d "/tmp/slskdn-rpmbuild-${version}.XXXXXX")"
          mkdir -p "$rpm_top"/{SOURCES,SPECS,SRPMS}
          
          # Copy supporting files
          cp "slskdn-${tag}-linux-x64.zip" "$rpm_top/SOURCES/"
          cp packaging/aur/slskd.service "$rpm_top/SOURCES/"
          cp packaging/aur/slskd.yml "$rpm_top/SOURCES/"
          cp packaging/aur/slskd.sysusers "$rpm_top/SOURCES/slskd.conf"
          cp packaging/aur/slskd.tmpfiles "$rpm_top/SOURCES/"
          # CI uses rpm_top; local fallback: cp packaging/aur/slskd.tmpfiles ~/rpmbuild/SOURCES/
          cp packaging/rpm/slskdn.spec "$rpm_top/SPECS/"
          
          # Build SRPM
          rpmbuild -bs "$rpm_top/SPECS/slskdn.spec" --define "_topdir $rpm_top"
          
          srpm="$rpm_top/SRPMS/slskdn-${version}-1.src.rpm"
          test -f "$srpm"
          mkdir -p dist
          cp "$srpm" "dist/slskdn-${version}-1.src.rpm"
          echo "Built SRPM: dist/slskdn-${version}-1.src.rpm"
          rpm -qpl "dist/slskdn-${version}-1.src.rpm" | head -20
          echo "SLSKDN_SRPM=dist/slskdn-${version}-1.src.rpm" >> "$GITHUB_ENV"

      - name: Upload to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          if [[ -z "${COPR_KERBEROS_PRINCIPAL:-}" || -z "${COPR_KERBEROS_KEYTAB_B64:-}" ]] \
            && [[ -z "${COPR_FEDORA_USERNAME:-}" || -z "${COPR_FEDORA_PASSWORD:-}" || -z "${COPR_FEDORA_OTP_SECRET:-}" ]] \
            && [[ -z "${COPR_LOGIN:-}" || -z "${COPR_TOKEN:-}" ]]; then
            echo "Skipping COPR upload - credentials not configured"
            exit 0
          fi
          copr_project="slskdn/slskdn"
          copr-cli get "$copr_project" >/dev/null
          
          srpm="${SLSKDN_SRPM:?Build SRPM step did not publish an SRPM path}"
          test -f "$srpm"
          echo "Uploading SRPM to COPR: $srpm"
          for attempt in 1 2 3; do
            if copr-cli --debug build "$copr_project" "$srpm" --nowait; then
              echo "Uploaded SRPM to COPR: $copr_project"
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "COPR upload failed after $attempt attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "COPR upload attempt $attempt failed; retrying in ${sleep_seconds}s." >&2
            sleep "$sleep_seconds"
          done
