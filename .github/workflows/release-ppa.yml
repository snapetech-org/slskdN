name: Upload to PPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to PPA'
        required: true

permissions:
  contents: read
jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    concurrency:
      group: slskdn-ppa-${{ matrix.ubuntu_series }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        ubuntu_series: [jammy, noble]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Convert 0.24.1-slskdn.7 to 0.24.1.slskdn.7 for debian version
          VERSION=$(echo "$TAG" | sed 's/-slskdn/.slskdn/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @slskdn/web build
          pnpm --filter @slskdn/web check:bundle

      - name: Build Backend
        run: |
          dotnet publish src/slskd/slskd.csproj \
            -c Release \
            -o publish-linux-x64 \
            --self-contained true \
            -r linux-x64 \
            -p:AllowMissingPrunePackageData=true

          dotnet publish src/slskdN.VpnAgent/slskdN-vpn-agent.csproj \
            -c Release \
            -o publish-linux-x64/vpn-agent \
            --self-contained true \
            -r linux-x64 \
            -p:PublishSingleFile=true
          cp src/slskdN.VpnAgent/README.md publish-linux-x64/vpn-agent/README.md
          cp src/slskdN.VpnAgent/GETTING_STARTED.md publish-linux-x64/vpn-agent/GETTING_STARTED.md
          cp src/slskdN.VpnAgent/manual-linux-wireguard.md publish-linux-x64/vpn-agent/manual-linux-wireguard.md
          cp src/slskdN.VpnAgent/external-tunnel.md publish-linux-x64/vpn-agent/external-tunnel.md
          cp src/slskdN.VpnAgent/self-hosted-relay.md publish-linux-x64/vpn-agent/self-hosted-relay.md
          cp src/slskdN.VpnAgent/windows-macos.md publish-linux-x64/vpn-agent/windows-macos.md
          cp src/slskdN.VpnAgent/api-contract.md publish-linux-x64/vpn-agent/api-contract.md
          cp docs/self-hosted-relay-tester-guide.md publish-linux-x64/vpn-agent/self-hosted-relay-tester-guide.md
          cp -r src/slskdN.VpnAgent/systemd publish-linux-x64/vpn-agent/
          cp -r src/slskdN.VpnAgent/examples publish-linux-x64/vpn-agent/
          cp src/slskdN.VpnAgent/Dockerfile.relay src/slskdN.VpnAgent/compose.relay.yml publish-linux-x64/vpn-agent/
          cp src/slskdN.VpnAgent/install.sh publish-linux-x64/vpn-agent/install.sh
          chmod +x publish-linux-x64/vpn-agent/slskdN-vpn-agent publish-linux-x64/vpn-agent/install.sh

      - name: Copy Web Assets
        run: |
          mkdir -p publish-linux-x64/wwwroot
          cp -r src/web/build/* publish-linux-x64/wwwroot/

      - name: Verify Publish Output
        run: |
          test -x publish-linux-x64/slskd || { echo 'missing slskd apphost'; exit 1; }
          test -x publish-linux-x64/vpn-agent/slskdN-vpn-agent || { echo 'missing VPN helper'; exit 1; }
          test -f publish-linux-x64/vpn-agent/systemd/slskdN-vpn-ingress.service || { echo 'missing VPN helper systemd units'; exit 1; }
          find publish-linux-x64 -name 'libcoreclrtraceptprovider.so' -print || true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper gnupg build-essential patchelf

      - name: Import and verify PPA signing key
        id: ppa-signing-key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: scripts/import-ppa-signing-key.sh

      - name: Prepare Source Structure
        run: |
          SRC_DIR="slskdn-${{ steps.version.outputs.version }}"
          # Create proper directory structure for debian packaging
          mkdir -p "$SRC_DIR/usr/lib/slskd"
          mkdir -p "$SRC_DIR/lib/systemd/system"
          mkdir -p "$SRC_DIR/etc/slskd"
          mkdir -p "$SRC_DIR/usr/lib/sysusers.d"
          mkdir -p "$SRC_DIR/usr/lib/tmpfiles.d"
          
          # Copy binary files from our build
          cp -r publish-linux-x64/* "$SRC_DIR/usr/lib/slskd/"
          
          # Copy service files from packaging
          cp packaging/aur/slskd.service "$SRC_DIR/lib/systemd/system/"
          cp packaging/aur/slskd.yml "$SRC_DIR/etc/slskd/"
          cp packaging/aur/slskd.sysusers "$SRC_DIR/usr/lib/sysusers.d/slskd.conf"
          cp packaging/aur/slskd.tmpfiles "$SRC_DIR/usr/lib/tmpfiles.d/slskd.conf"

      - name: Prepare Source Package
        id: ppa-package
        run: |
          SRC_DIR="slskdn-${{ steps.version.outputs.version }}"
          SERIES="${{ matrix.ubuntu_series }}"
          # Create tarball for orig source
          tar -czvf "slskdn_${{ steps.version.outputs.version }}.orig.tar.gz" "$SRC_DIR"
          
          # Copy debian directory
          cp -r packaging/debian "$SRC_DIR/"
          find "$SRC_DIR/usr/lib/slskd" -type f \
            | sed "s#^$SRC_DIR/##" \
            > "$SRC_DIR/debian/source/include-binaries"
          
          # Use timestamp-based PPA revision to avoid conflicts on rebuilds
          PPA_REV=$(date +%Y%m%d%H%M)
          PPA_VERSION="${{ steps.version.outputs.version }}-1ppa${PPA_REV}~${SERIES}"
          echo "version=$PPA_VERSION" >> "$GITHUB_OUTPUT"
          
          # Update changelog
          cd "$SRC_DIR"
          cat > debian/changelog << EOF
          slskdn (${PPA_VERSION}) ${SERIES}; urgency=medium
          
            * Release ${{ steps.version.outputs.tag }}
          
           -- slskdn <slskdn@proton.me>  $(date -R)
          EOF

      - name: Preflight Binary Package Build
        run: |
          cd "slskdn-${{ steps.version.outputs.version }}"
          dpkg-buildpackage -us -uc -b -d
          dh clean
          rm -f ../*.deb ../*.buildinfo ../*_*.changes

      - name: Build Source Package
        if: steps.ppa-signing-key.outputs.fingerprint != ''
        env:
          GPG_SIGNING_FINGERPRINT: ${{ steps.ppa-signing-key.outputs.fingerprint }}
        run: |
          cd "slskdn-${{ steps.version.outputs.version }}"
          debuild -S -sa -d -k"$GPG_SIGNING_FINGERPRINT"

      - name: Preflight Launchpad PPA Upload
        env:
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
        run: |
          if [ -n "$LAUNCHPAD_SFTP_KEY" ]; then
            LAUNCHPAD_PPA_SFTP_IPV4=$(getent ahostsv4 ppa.launchpad.net | awk '$2 == "STREAM" { print $1; exit }')
            if [ -z "$LAUNCHPAD_PPA_SFTP_IPV4" ]; then
              echo "::warning::Unable to resolve an IPv4 address for ppa.launchpad.net SFTP; trying FTP fallback"
              getent ahosts ppa.launchpad.net || true
            else

              echo "Pinning ppa.launchpad.net to IPv4 ${LAUNCHPAD_PPA_SFTP_IPV4} for PPA SFTP upload"
              echo "${LAUNCHPAD_PPA_SFTP_IPV4} ppa.launchpad.net" | sudo tee -a /etc/hosts
              getent ahosts ppa.launchpad.net

              if python3 - <<'PY'
          import socket

          with socket.create_connection(("ppa.launchpad.net", 22), timeout=120) as sock:
              print(f"Connected to {sock.getpeername()[0]}:{sock.getpeername()[1]} over SSH")
          PY
              then
                echo "SLSKDN_PPA_UPLOAD_METHOD=sftp" >> "$GITHUB_ENV"
                exit 0
              fi

              echo "::warning::Launchpad PPA SFTP endpoint is not reachable; trying FTP fallback"
            fi
          fi

          LAUNCHPAD_PPA_FTP_IPV4=$(getent ahostsv4 ppa.launchpad.net | awk '$2 == "STREAM" { print $1; exit }')
          if [ -z "$LAUNCHPAD_PPA_FTP_IPV4" ]; then
            echo "::error::Unable to resolve an IPv4 address for ppa.launchpad.net"
            getent ahosts ppa.launchpad.net || true
            exit 1
          fi

          echo "Pinning ppa.launchpad.net to IPv4 ${LAUNCHPAD_PPA_FTP_IPV4} for PPA FTP upload"
          echo "${LAUNCHPAD_PPA_FTP_IPV4} ppa.launchpad.net" | sudo tee -a /etc/hosts
          getent ahosts ppa.launchpad.net

          if ! python3 - <<'PY'
          import socket

          with socket.create_connection(("ppa.launchpad.net", 21), timeout=120) as sock:
              print(f"Connected to {sock.getpeername()[0]}:{sock.getpeername()[1]}")
          PY
          then
            echo "::error::Launchpad PPA FTP endpoint is not reachable over IPv4"
            exit 1
          fi
          echo "SLSKDN_PPA_UPLOAD_METHOD=ftp" >> "$GITHUB_ENV"

      - name: Upload to PPA
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
          LAUNCHPAD_SFTP_USER: ${{ secrets.LAUNCHPAD_SFTP_USER }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Skipping PPA upload - GPG_PRIVATE_KEY not configured"
            exit 0
          fi
          LAUNCHPAD_SFTP_USER="${LAUNCHPAD_SFTP_USER:-keefshape}"
          ls -la *.changes || true
          CHANGES_FILE=$(find . -name "*.changes" -type f | head -1)
          echo "Found changes file: $CHANGES_FILE"

          gpg --verify "$CHANGES_FILE"
          DSC_FILE=$(awk '/\.dsc$/ { print $NF; exit }' "$CHANGES_FILE")
          if [ -z "$DSC_FILE" ] || [ ! -f "$DSC_FILE" ]; then
            echo "::error::Unable to find signed .dsc referenced by $CHANGES_FILE"
            exit 1
          fi
          gpg --verify "$DSC_FILE"

          mapfile -t SOURCE_FILES < <(
            awk '
              /^Files:/ { in_files = 1; next }
              in_files && /^[A-Za-z0-9-]+:/ { in_files = 0 }
              in_files && NF >= 5 { print $5 }
            ' "$CHANGES_FILE"
          )

          if [ "${#SOURCE_FILES[@]}" -eq 0 ]; then
            echo "::error::No source files found in $CHANGES_FILE"
            exit 1
          fi

          uploaded=0
          if [ "${SLSKDN_PPA_UPLOAD_METHOD:-ftp}" = "sftp" ] && [ -n "$LAUNCHPAD_SFTP_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$LAUNCHPAD_SFTP_KEY" > ~/.ssh/launchpad_ppa
            chmod 600 ~/.ssh/launchpad_ppa
            ssh-keyscan -T 30 -t rsa,ecdsa,ed25519 ppa.launchpad.net >> ~/.ssh/known_hosts 2>/dev/null || true
            cat >> ~/.ssh/config << EOF
          Host ppa.launchpad.net
            HostName ppa.launchpad.net
            User ${LAUNCHPAD_SFTP_USER}
            IdentityFile ~/.ssh/launchpad_ppa
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            NumberOfPasswordPrompts 0
            StrictHostKeyChecking accept-new
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF

            cat > ~/.dput.cf << EOF
          [slskdn-ppa-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~keefshape/ubuntu/slskdn/
          login = ${LAUNCHPAD_SFTP_USER}
          allow_unsigned_uploads = 0
          EOF

            echo "Uploading $(basename "$CHANGES_FILE") to Launchpad PPA over SFTP"
            if timeout --preserve-status 1800 dput --config ~/.dput.cf slskdn-ppa-sftp "$CHANGES_FILE"; then
              uploaded=1
            else
              echo "::warning::Launchpad SFTP upload failed; trying anonymous FTP fallback"
            fi
          fi

          if [ "$uploaded" -ne 1 ]; then
            cat > ~/.dput.cf << 'EOF'
          [slskdn-ppa-ftp]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~keefshape/ubuntu/slskdn/
          passive_ftp = 1
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

            echo "Uploading $(basename "$CHANGES_FILE") to Launchpad PPA over anonymous FTP"
            timeout --preserve-status 1800 dput --config ~/.dput.cf slskdn-ppa-ftp "$CHANGES_FILE"
          fi

          echo "✅ Uploaded to PPA: slskdn"

      - name: Wait for PPA Publication
        run: |
          scripts/wait-for-launchpad-ppa-publication.sh \
            "${{ steps.ppa-package.outputs.version }}" \
            "${{ matrix.ubuntu_series }}"
