name: slskNet.Runtime Sync

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'vendor/slskNet.Runtime/**'
      - 'vendor/slskNet.Runtime.sync'
      - 'vendor/slskNet.Runtime.patches/**'
      - 'scripts/check-slsknet-runtime-sync.sh'
      - 'scripts/sync-slsknet-runtime.sh'
      - 'docs/slsknet-runtime-sync.md'
      - '.github/workflows/runtime-sync.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify vendored runtime is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify slskNet.Runtime sync
        run: bash scripts/check-slsknet-runtime-sync.sh
