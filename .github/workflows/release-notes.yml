# ng-runner-policy: private-jit-only-v1
name: Release-note contract

on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
concurrency:
  group: ng-release-notes-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-notes:
    name: Validate release-note fragment or explicit opt-out
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)) }}
    steps:
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout -- this checks out only the trusted base SHA; the PR head is fetched as data and never executed.
      - name: Check out the pull-request base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch the pull-request head
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 "https://github.com/${HEAD_REPOSITORY}.git" "${HEAD_SHA}"

      - name: Validate and preview release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body-env PR_BODY \
            --summary-file "$GITHUB_STEP_SUMMARY"

