# ng-runner-policy: private-jit-only-v1
name: CodeQL (C#)

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
concurrency:
  group: ng-scan-codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: '10.0.402'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          # Keep main-branch scanning focused on security findings; the broader suite
          # turns maintainability heuristics into thousands of repo alerts.
          queries: security-extended
          config: |
            paths-ignore:
              - '.dotnet/**'
            query-filters:
              - exclude:
                  id: cs/log-forging

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/slskd/slskd.csproj

      - name: Build (CodeQL traces compilation)
        run: dotnet build src/slskd/slskd.csproj --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:csharp

