# ng-runner-policy: hosted-first-v1
name: CodeQL (C#)

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

concurrency:
  group: ng-scan-codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  DOTNET_VERSION: '10.0.402'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: csharp
          # Keep main-branch scanning focused on security findings; the broader suite
          # turns maintainability heuristics into thousands of repo alerts.
          queries: security-extended
          config: |
            paths-ignore:
              - '.dotnet/**'
            query-filters:
              - exclude:
                  id: cs/log-forging

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/slskd/slskd.csproj

      - name: Build (CodeQL traces compilation)
        run: dotnet build src/slskd/slskd.csproj --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:csharp

