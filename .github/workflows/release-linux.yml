name: Release Linux Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true

permissions:
  contents: write
jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Build Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @slskdn/web build
          pnpm --filter @slskdn/web check:bundle

      - name: Build Backend
        run: |
          dotnet publish src/slskd/slskd.csproj \
            -c Release \
            -o publish-linux-${{ matrix.arch }} \
            --self-contained true \
            -r linux-${{ matrix.arch }} \
            -p:PublishReadyToRun=false \
            -p:AllowMissingPrunePackageData=true

          dotnet publish src/slskdN.VpnAgent/slskdN-vpn-agent.csproj \
            -c Release \
            -o publish-linux-${{ matrix.arch }}/vpn-agent \
            --self-contained true \
            -r linux-${{ matrix.arch }} \
            -p:PublishSingleFile=true
          cp src/slskdN.VpnAgent/README.md publish-linux-${{ matrix.arch }}/vpn-agent/README.md
          cp src/slskdN.VpnAgent/GETTING_STARTED.md publish-linux-${{ matrix.arch }}/vpn-agent/GETTING_STARTED.md
          cp src/slskdN.VpnAgent/manual-linux-wireguard.md publish-linux-${{ matrix.arch }}/vpn-agent/manual-linux-wireguard.md
          cp src/slskdN.VpnAgent/external-tunnel.md publish-linux-${{ matrix.arch }}/vpn-agent/external-tunnel.md
          cp src/slskdN.VpnAgent/self-hosted-relay.md publish-linux-${{ matrix.arch }}/vpn-agent/self-hosted-relay.md
          cp src/slskdN.VpnAgent/windows-macos.md publish-linux-${{ matrix.arch }}/vpn-agent/windows-macos.md
          cp src/slskdN.VpnAgent/api-contract.md publish-linux-${{ matrix.arch }}/vpn-agent/api-contract.md
          cp docs/self-hosted-relay-tester-guide.md publish-linux-${{ matrix.arch }}/vpn-agent/self-hosted-relay-tester-guide.md
          cp -r src/slskdN.VpnAgent/systemd publish-linux-${{ matrix.arch }}/vpn-agent/
          cp -r src/slskdN.VpnAgent/examples publish-linux-${{ matrix.arch }}/vpn-agent/
          cp src/slskdN.VpnAgent/Dockerfile.relay src/slskdN.VpnAgent/compose.relay.yml publish-linux-${{ matrix.arch }}/vpn-agent/
          cp src/slskdN.VpnAgent/install.sh publish-linux-${{ matrix.arch }}/vpn-agent/install.sh
          chmod +x publish-linux-${{ matrix.arch }}/vpn-agent/slskdN-vpn-agent publish-linux-${{ matrix.arch }}/vpn-agent/install.sh

      - name: Copy Web Assets
        run: |
          cp -r src/web/build/* publish-linux-${{ matrix.arch }}/wwwroot/

      - name: Verify Publish Output
        run: |
          test -x publish-linux-${{ matrix.arch }}/slskd || { echo 'missing slskd apphost'; exit 1; }
          test -x publish-linux-${{ matrix.arch }}/vpn-agent/slskdN-vpn-agent || { echo 'missing VPN helper'; exit 1; }
          test -f publish-linux-${{ matrix.arch }}/vpn-agent/systemd/slskdN-vpn-ingress.service || { echo 'missing VPN helper systemd units'; exit 1; }
          find publish-linux-${{ matrix.arch }} -name 'libcoreclrtraceptprovider.so' -print || true

      - name: Get Version
        id: version
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Zip
        run: |
          cd publish-linux-${{ matrix.arch }}
          zip -r ../slskdn-main-linux-glibc-${{ matrix.arch }}.zip .

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            slskdn-main-linux-glibc-${{ matrix.arch }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slskdn-linux-${{ matrix.arch }}
          path: slskdn-main-linux-glibc-${{ matrix.arch }}.zip

  update-aur:
    needs: build-linux
    runs-on: ubuntu-latest
    # Run on both release events and workflow_dispatch (triggered by CI after release)
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Version
        id: version
        run: |
          # Get tag from either workflow_dispatch input or release ref
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          # Convert 0.24.1-slskdn.3 to 0.24.1.slskdn.3 for PKGBUILD
          PKGVER=$(echo $TAG | sed 's/-slskdn/.slskdn/')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "pkgver=${PKGVER}" >> $GITHUB_OUTPUT

      - name: Wait for Linux Release Asset
        id: wait_for_linux_asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURL_AUTH_ARGS=()
          if [ -n "$GH_TOKEN" ]; then
            CURL_AUTH_ARGS=(-H "Authorization: Bearer ${GH_TOKEN}")
          fi

          ASSET_NAMES=(
            "slskdn-main-linux-glibc-x64.zip"
            "slskdn-main-linux-x64.zip"
            "slskdn-${{ steps.version.outputs.tag }}-linux-x64.zip"
          )

          for attempt in {1..20}; do
            for ASSET_NAME in "${ASSET_NAMES[@]}"; do
              ASSET_URL="https://github.com/snapetech/slskdn/releases/download/${{ steps.version.outputs.tag }}/${ASSET_NAME}"
              echo "Attempt $attempt: checking ${ASSET_NAME}..."

              if curl -fsSL "${CURL_AUTH_ARGS[@]}" -H "Accept: application/octet-stream" "$ASSET_URL" -o release-linux-x64.zip; then
                echo "Found Linux asset: ${ASSET_NAME}"
                exit 0
              fi
            done

            if [ "$attempt" -eq 20 ]; then
              echo "Failed to download a Linux x64 asset after 10 minutes"
              exit 1
            fi

            echo "Assets not ready, waiting 30s..."
            sleep 30
          done

      - name: Update PKGBUILDs
        run: |
          cd packaging/aur
          # Compute hashes for static files (these never change between releases)
          SVC_SUM=$(sha256sum slskd.service | awk '{print $1}')
          YML_SUM=$(sha256sum slskd.yml     | awk '{print $1}')
          SYS_SUM=$(sha256sum slskd.sysusers | awk '{print $1}')
          TMP_SUM=$(sha256sum slskd.tmpfiles | awk '{print $1}')
          echo "slskd.service : $SVC_SUM"
          echo "slskd.yml     : $YML_SUM"
          echo "slskd.sysusers: $SYS_SUM"
          echo "slskd.tmpfiles: $TMP_SUM"

          # Update binary package PKGBUILD
          # source=() order: zip slskd.service slskd.yml slskd.sysusers slskd.tmpfiles
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.pkgver }}/" PKGBUILD-bin
          # keep binary archive hash on SKIP since release assets are mutable and can be replaced in-place
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP' '$SVC_SUM' '$YML_SUM' '$SYS_SUM' '$TMP_SUM')/" PKGBUILD-bin

          # Update source package PKGBUILD (tarball is SKIP, static file hashes are the same)
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.pkgver }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP' '$SVC_SUM' '$YML_SUM' '$SYS_SUM' '$TMP_SUM')/" PKGBUILD

          bash ../scripts/validate-aur-pkgbuild-hashes.sh PKGBUILD PKGBUILD-bin

      - name: Setup and Push to AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "⚠️ AUR_SSH_KEY not configured. Skipping AUR push."
            echo "To enable automatic AUR updates, add AUR_SSH_KEY secret."
            exit 0
          fi
          
          # Setup SSH
          tmp_key=$(mktemp)
          trap 'rm -f "$tmp_key"' EXIT
          printf '%s\n' "$AUR_SSH_KEY" > "$tmp_key"
          bash packaging/scripts/setup-aur-ssh.sh "$tmp_key"
          
          # Configure git
          git config --global user.email "slskdn@proton.me"
          git config --global user.name "slskdn"
          
          # Function to generate .SRCINFO from PKGBUILD (without makepkg)
          generate_srcinfo() {
            local pkgbuild="$1"
            source "$pkgbuild"
            
            echo "pkgbase = ${pkgname}"
            printf '\tpkgdesc = %s\n' "${pkgdesc}"
            printf '\tpkgver = %s\n' "${pkgver}"
            printf '\tpkgrel = %s\n' "${pkgrel}"
            printf '\turl = %s\n' "${url}"
            for arch in "${arch[@]}"; do printf '\tarch = %s\n' "$arch"; done
            printf '\tlicense = %s\n' "${license[0]}"
            for dep in "${depends[@]}"; do printf '\tdepends = %s\n' "$dep"; done
            for dep in "${makedepends[@]}"; do printf '\tmakedepends = %s\n' "$dep"; done
            for dep in "${optdepends[@]}"; do printf '\toptdepends = %s\n' "$dep"; done
            for prov in "${provides[@]}"; do printf '\tprovides = %s\n' "$prov"; done
            for conf in "${conflicts[@]}"; do printf '\tconflicts = %s\n' "$conf"; done
            for repl in "${replaces[@]}"; do printf '\treplaces = %s\n' "$repl"; done
            for opt in "${options[@]}"; do printf '\toptions = %s\n' "$opt"; done
            for bak in "${backup[@]}"; do printf '\tbackup = %s\n' "$bak"; done
            for src in "${source[@]}"; do printf '\tsource = %s\n' "$src"; done
            for sum in "${sha256sums[@]}"; do printf '\tsha256sums = %s\n' "$sum"; done
            echo ""
            echo "pkgname = ${pkgname}"
          }
          
          # Clone and update AUR repo (slskdn-bin)
          bash packaging/scripts/checkout-aur-repo.sh slskdn-bin aur-repo
          cd aur-repo
          cp ../packaging/aur/PKGBUILD-bin PKGBUILD
          cp ../packaging/aur/slskd.service .
          cp ../packaging/aur/slskd.yml .
          cp ../packaging/aur/slskd.sysusers .
          cp ../packaging/aur/slskd.tmpfiles .
          cp ../packaging/aur/slskd.install .
          generate_srcinfo PKGBUILD > .SRCINFO
          git add -A
          bash ../packaging/scripts/push-aur-repo.sh . slskdn-bin "Update to ${{ steps.version.outputs.tag }}"
          cd ..
          
          # Clone and update AUR repo (slskdn source)
          bash packaging/scripts/checkout-aur-repo.sh slskdn aur-repo-src
          cd aur-repo-src
          cp ../packaging/aur/PKGBUILD .
          cp ../packaging/aur/slskd.service .
          cp ../packaging/aur/slskd.yml .
          cp ../packaging/aur/slskd.sysusers .
          cp ../packaging/aur/slskd.tmpfiles .
          cp ../packaging/aur/slskd.install .
          generate_srcinfo PKGBUILD > .SRCINFO
          git add -A
          bash ../packaging/scripts/push-aur-repo.sh . slskdn "Update to ${{ steps.version.outputs.tag }}"
