name: CI Enhancements

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-slskdn.*"
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.100'
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  NODE_VERSION: '22.22.2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
jobs:
  performance-regression:
    name: Performance Regression Testing
    # All pull requests and manual dispatches outside main use hosted runners.
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'ubuntu-latest' || vars.PREFER_SELF_HOSTED != 'false' && fromJSON('["self-hosted","Linux","X64","slskdn"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET
        run: dotnet --version

      - name: Build Performance Benchmark Project
        run: |
          dotnet build tests/slskd.Tests.Performance/slskd.Tests.Performance.csproj --configuration Release --no-incremental

      - name: Run Performance Benchmarks
        id: benchmarks
        run: |
          dotnet run --project tests/slskd.Tests.Performance/slskd.Tests.Performance.csproj \
            --configuration Release \
            --no-build \
            -- \
            --exporters json \
            --artifacts BenchmarkDotNet.Artifacts

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            tests/slskd.Tests.Performance/BenchmarkDotNet.Artifacts/results/*.json
            tests/slskd.Tests.Performance/BenchmarkDotNet.Artifacts/results/*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Compare Against Baseline
        if: steps.benchmarks.outcome == 'success'
        run: |
          echo "## Performance Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmarks completed. Results uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review benchmark results in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Compare against previous runs to detect regressions" >> $GITHUB_STEP_SUMMARY
          echo "- Investigate any significant performance degradation (>10%)" >> $GITHUB_STEP_SUMMARY

  load-testing:
    name: Load Testing
    # Keep the load harness on an isolated hosted runner after SIGBUS on a local runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify .NET
        run: dotnet --version

      - name: Build Application
        run: |
          dotnet build src/slskd/slskd.csproj -c Release --no-incremental

      - name: Start Application
        run: |
          cat > "$RUNNER_TEMP/slskdn-load-test.yml" <<'YAML'
          dht:
            enabled: false
          web:
            port: 5099
            address: 127.0.0.1
            content_path: wwwroot
            https:
              disabled: true
            authentication:
              disabled: true
          shares: []
          flags:
            no_share_scan: true
          YAML
          # Start slskdn in background for load testing
          application_assembly="src/slskd/bin/Release/net10.0/slskd.dll"
          application_directory="$(dirname "$application_assembly")"
          # API-only startup still validates the static content directory.
          mkdir -p "$application_directory/wwwroot"
          dotnet "$application_assembly" \
            --config "$RUNNER_TEMP/slskdn-load-test.yml" \
            --app-dir "$RUNNER_TEMP/slskdn-load-test" \
            --no-connect \
            --no-auth \
            --no-https \
            --http-address 127.0.0.1 \
            --http-port 5099 &
          printf '%s\n' "$!" > "$RUNNER_TEMP/slskdn-load-test.pid"
          # Wait for the loopback-only test instance to become healthy.
          timeout 60 bash -c 'until curl -f http://127.0.0.1:5099/api/v0/session/enabled; do sleep 2; done' || { echo 'Application did not become healthy for load testing' >&2; exit 1; }

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1

      - name: Create Load Test Script
        run: |
          cat > "$RUNNER_TEMP/load-test.js" << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const errorRate = new Rate('errors');

          export const options = {
            stages: [
              { duration: '30s', target: 10 },   // Ramp up to 10 users
              { duration: '1m', target: 50 },     // Ramp up to 50 users
              { duration: '2m', target: 100 },    // Stay at 100 users
              { duration: '1m', target: 50 },     // Ramp down to 50 users
              { duration: '30s', target: 0 },    // Ramp down to 0 users
            ],
            thresholds: {
              'http_req_duration': ['p(95)<500', 'p(99)<1000'], // 95% of requests < 500ms, 99% < 1s
              'http_req_failed': ['rate<0.01'],                 // Error rate < 1%
              'errors': ['rate<0.01'],                           // Custom error rate < 1%
            },
          };

          const BASE_URL = __ENV.BASE_URL || 'http://localhost:5099';

          export default function () {
            // Test session endpoint
            const sessionRes = http.get(`${BASE_URL}/api/v0/session/enabled`);
            check(sessionRes, {
              'session status is 200': (r) => r.status === 200,
            }) || errorRate.add(1);

            // Test application state endpoint
            const stateRes = http.get(`${BASE_URL}/api/v0/application`);
            check(stateRes, {
              'state status is 200': (r) => r.status === 200,
            }) || errorRate.add(1);

            sleep(1);
          }
          EOF

      - name: Run Load Tests
        id: loadtest
        env:
          BASE_URL: http://127.0.0.1:5099
        run: |
          k6 run --out "json=$RUNNER_TEMP/load-test-results.json" "$RUNNER_TEMP/load-test.js"

      - name: Upload Load Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-test-results
          path: ${{ runner.temp }}/load-test-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Stop Application
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/slskdn-load-test.pid"
          if [[ -f "$pid_file" ]]; then
            load_test_pid="$(cat "$pid_file")"
            if [[ "$load_test_pid" =~ ^[0-9]+$ ]]; then
              kill "$load_test_pid" 2>/dev/null || true
              for _ in {1..15}; do
                kill -0 "$load_test_pid" 2>/dev/null || break
                sleep 1
              done
              kill -0 "$load_test_pid" 2>/dev/null && kill -9 "$load_test_pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi

      - name: Report Load Test Results
        if: steps.loadtest.outcome == 'success'
        run: |
          echo "## Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Load tests completed. Results uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Ramp up: 10 → 50 → 100 users" >> $GITHUB_STEP_SUMMARY
          echo "- Sustained load: 100 users for 2 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Thresholds: 95% < 500ms, 99% < 1s, error rate < 1%" >> $GITHUB_STEP_SUMMARY

  dependency-scanning:
    name: Dependency Scanning
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'ubuntu-latest' || vars.PREFER_SELF_HOSTED != 'false' && fromJSON('["self-hosted","Linux","X64","slskdn"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Web workspace
        run: pnpm install --frozen-lockfile

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Scan NuGet Dependencies
        run: |
          set -euo pipefail
          # Use -p:Version=0.0.0 to prevent VERSION env var from being read as MSBuild $(Version),
          # which would cause NuGet to reject build-main-* prefixed strings as invalid semver.
          dotnet restore src/slskd/slskd.csproj -p:Version=0.0.0
          dotnet list src/slskd/slskd.csproj package --vulnerable --include-transitive 2>&1 | tee "$TMPDIR/nuget-vuln.txt"
          if grep -qiE 'High|Critical' "$TMPDIR/nuget-vuln.txt"; then
            echo "::error::NuGet HIGH or CRITICAL vulnerability detected"
            cat "$TMPDIR/nuget-vuln.txt"
            exit 1
          fi

      - name: Scan Web Dependencies
        run: |
          pnpm audit --prod --audit-level high

      - name: Report Results
        if: always()
        run: |
          echo "## Dependency Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- NuGet: checked for HIGH/CRITICAL CVEs" >> $GITHUB_STEP_SUMMARY
          echo "- npm: checked for HIGH/CRITICAL CVEs (production deps)" >> $GITHUB_STEP_SUMMARY

  container-scanning:
    name: Container Scanning (Trivy)
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && 'ubuntu-latest' || vars.PREFER_SELF_HOSTED != 'false' && fromJSON('["self-hosted","Linux","X64","slskdn"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker Image
        run: docker build -t slskdn:test -f Dockerfile .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: slskdn:test
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          format: json
          output: trivy-results.json

      - name: Upload Trivy Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Report Results
        if: always()
        run: |
          echo "## Container Scan Results (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- Image: Dockerfile" >> $GITHUB_STEP_SUMMARY
          echo "- Severity: HIGH, CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- Results uploaded as artifacts" >> $GITHUB_STEP_SUMMARY
