name: Build on Tag

# Trigger: push tag matching build-main-* or build-dev-*
#
# Examples:
#   git tag build-main-0.24.3-slskdn.44 && git push origin $_
#   git tag build-dev-0.24.3-dev.20260505 && git push origin $_

on:
  push:
    tags:
      - 'build-main-*'
      - 'build-dev-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing build-main tag whose GitHub release assets are already published.
        required: true
        type: string
      retry_aur:
        description: Retry the AUR publisher
        required: false
        default: false
        type: boolean
      retry_copr:
        description: Retry the COPR publisher
        required: false
        default: false
        type: boolean
      retry_ppa:
        description: Retry the PPA publisher
        required: false
        default: false
        type: boolean
      retry_docker:
        description: Retry the main Docker publisher
        required: false
        default: false
        type: boolean
      retry_nix:
        description: Retry the Nix metadata publisher
        required: false
        default: false
        type: boolean

env:
  DOTNET_VERSION: '10.0.100'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions: {}
jobs:
  parse:
    name: Parse Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.parse.outputs.channel }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse Tag
        id: parse
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          RETRY_AUR: ${{ inputs.retry_aur }}
          RETRY_COPR: ${{ inputs.retry_copr }}
          RETRY_PPA: ${{ inputs.retry_ppa }}
          RETRY_DOCKER: ${{ inputs.retry_docker }}
          RETRY_NIX: ${{ inputs.retry_nix }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$TAG" =~ ^build-main-[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Manual publisher recovery requires an existing build-main-* tag"
              exit 1
            fi
            if [[ "$RETRY_AUR" != true && "$RETRY_COPR" != true && "$RETRY_PPA" != true && "$RETRY_DOCKER" != true && "$RETRY_NIX" != true ]]; then
              echo "::error::Select at least one publisher to retry"
              exit 1
            fi
          fi
          
          # Extract channel and version from tag
          # Format: build-main-<version> or build-dev-<version>
          if [[ "$TAG" =~ ^build-(main|dev)-(.+)$ ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "::error::Invalid tag format. Expected: build-main-<version> or build-dev-<version>"
            exit 1
          fi
          
          echo "Channel: $CHANNEL"
          echo "Version: $VERSION"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::Manual publisher recovery requires an existing published release for $TAG"
            exit 1
          fi
          
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: parse
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Release Gate
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          TMPDIR: ${{ runner.temp }}
        run: bash packaging/scripts/run-release-gate.sh

      - name: Upload validation engine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-engine-release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/slskdn-validation-*/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Web Content
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-content
          path: src/web/build
          retention-days: 7

  publish:
    name: Publish ${{ matrix.runtime }}
    needs: [parse, build]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime:
          - linux-x64
          - linux-musl-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Web Content
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-content
          path: src/slskd/wwwroot

      - name: Build ${{ matrix.runtime }}
        run: |
          PUBLIC_VERSION="${{ needs.parse.outputs.version }}"
          if [[ "$PUBLIC_VERSION" =~ ^([0-9]{8,10})-slskdn\.([0-9]+)$ ]]; then
            DOTNET_VERSION="0.0.0-slskdn.${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            DOTNET_VERSION=$(echo "$PUBLIC_VERSION" | sed 's/\.dev\./-dev-/')
          fi
          echo "Building with version: $DOTNET_VERSION"
          echo "Public version: $PUBLIC_VERSION"
          # Explicit Version + InformationalVersion so the binary always reports the correct version
          dotnet publish src/slskd/slskd.csproj \
            -c Release \
            -o publish-${{ matrix.runtime }} \
            --self-contained true \
            -r ${{ matrix.runtime }} \
            /p:Version="$DOTNET_VERSION" \
            /p:InformationalVersion="$PUBLIC_VERSION" \
            /p:PackageVersion="$DOTNET_VERSION" \
            /p:AllowMissingPrunePackageData=true

          dotnet publish src/slskdN.VpnAgent/slskdN-vpn-agent.csproj \
            -c Release \
            -o publish-${{ matrix.runtime }}/vpn-agent \
            --self-contained true \
            -r ${{ matrix.runtime }} \
            /p:PublishSingleFile=true \
            /p:Version="$DOTNET_VERSION" \
            /p:InformationalVersion="$PUBLIC_VERSION" \
            /p:PackageVersion="$DOTNET_VERSION"
          cp src/slskdN.VpnAgent/README.md publish-${{ matrix.runtime }}/vpn-agent/README.md
          cp src/slskdN.VpnAgent/GETTING_STARTED.md publish-${{ matrix.runtime }}/vpn-agent/GETTING_STARTED.md
          cp src/slskdN.VpnAgent/manual-linux-wireguard.md publish-${{ matrix.runtime }}/vpn-agent/manual-linux-wireguard.md
          cp src/slskdN.VpnAgent/external-tunnel.md publish-${{ matrix.runtime }}/vpn-agent/external-tunnel.md
          cp src/slskdN.VpnAgent/self-hosted-relay.md publish-${{ matrix.runtime }}/vpn-agent/self-hosted-relay.md
          cp src/slskdN.VpnAgent/windows-macos.md publish-${{ matrix.runtime }}/vpn-agent/windows-macos.md
          cp src/slskdN.VpnAgent/api-contract.md publish-${{ matrix.runtime }}/vpn-agent/api-contract.md
          cp docs/self-hosted-relay-tester-guide.md publish-${{ matrix.runtime }}/vpn-agent/self-hosted-relay-tester-guide.md
          case "${{ matrix.runtime }}" in
            linux-*)
              cp -r src/slskdN.VpnAgent/systemd publish-${{ matrix.runtime }}/vpn-agent/
              cp -r src/slskdN.VpnAgent/examples publish-${{ matrix.runtime }}/vpn-agent/
              cp src/slskdN.VpnAgent/Dockerfile.relay src/slskdN.VpnAgent/compose.relay.yml publish-${{ matrix.runtime }}/vpn-agent/
              cp src/slskdN.VpnAgent/install.sh publish-${{ matrix.runtime }}/vpn-agent/install.sh
              chmod +x publish-${{ matrix.runtime }}/vpn-agent/slskdN-vpn-agent publish-${{ matrix.runtime }}/vpn-agent/install.sh
              ;;
          esac

      - name: Create Archive
        run: |
          cd publish-${{ matrix.runtime }}

          ASSET_RUNTIME="${{ matrix.runtime }}"
          case "${{ matrix.runtime }}" in
            linux-x64)
              ASSET_RUNTIME="linux-glibc-x64"
              ;;
            linux-arm64)
              ASSET_RUNTIME="linux-glibc-arm64"
              ;;
          esac

          CHANNEL_ARCHIVE="slskdn-${{ needs.parse.outputs.channel }}-${ASSET_RUNTIME}.zip"
          zip -r "../${CHANNEL_ARCHIVE}" .

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slskdn-${{ needs.parse.outputs.channel }}-${{ matrix.runtime }}
          path: slskdn*.zip
          retention-days: 30

  release-main:
    name: Create Main Release
    needs: [parse, publish]
    if: needs.parse.outputs.channel == 'main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.release-body.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: slskdn-main-*

      - name: Prepare Release Assets
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          cp packaging/aur/slskd.service packaging/aur/slskd.yml packaging/aur/slskd.sysusers packaging/aur/slskd.tmpfiles release/
          cp packaging/linux/install-from-release.sh release/install-linux-release.sh
          chmod +x release/install-linux-release.sh
          cd release && sha256sum *.zip slskd.service slskd.yml slskd.sysusers slskd.tmpfiles install-linux-release.sh > SHA256SUMS.txt && cd ..
          ls -lh release/
          echo "=== SHA256SUMS.txt ==="
          cat release/SHA256SUMS.txt

      - name: Generate release notes (repo-backed)
        env:
          RELEASE_NOTES_PRODUCT_NAME: slskdN
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-release-notes.sh
          ./scripts/generate-release-notes.sh \
            "${{ needs.parse.outputs.version }}" \
            release/RELEASE_NOTES.md \
            "${{ github.sha }}"
          ./scripts/validate-release-notes.sh \
            "${{ needs.parse.outputs.version }}" \
            release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md

      # Creates release under VERSION tag (e.g., 0.24.1-slskdn.35) for backward compatibility
      # Build was triggered by build-main-VERSION tag, but release uses traditional format
      - name: Create Main Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.parse.outputs.version }}
          name: "🔋 slskdN ${{ needs.parse.outputs.version }} - The Batteries-Included Fork"
          body_path: release/RELEASE_NOTES.md
          prerelease: false
          files: release/*

      - name: Export release body
        id: release-body
        shell: bash
        run: |
          set -euo pipefail
          delimiter="release_body_${GITHUB_RUN_ID}"
          {
            echo "release_body<<${delimiter}"
            cat release/RELEASE_NOTES.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Trigger Package Workflows
        if: success()
        run: |
          echo "✅ Main release created: ${{ needs.parse.outputs.version }}"
          echo "📦 Package publishing jobs will run below..."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce-main:
    name: Announce Main Release to Discord
    needs: [parse, release-main]
    if: needs.parse.outputs.channel == 'main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Post Discord announcement
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.parse.outputs.version }}
          VERSION: ${{ needs.parse.outputs.version }}
          TRIGGER_TAG: ${{ github.ref_name }}
          RELEASE_BODY: ${{ needs.release-main.outputs.release_body }}
        run: |
          if [ -z "$DISCORD_RELEASE_WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not configured; skipping Discord announcement."
            exit 0
          fi

          if ! python3 - <<'PY' | curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Content-Type: application/json" \
            -d @- \
            "$DISCORD_RELEASE_WEBHOOK"
          import json
          import os

          version = os.environ["VERSION"]
          trigger_tag = os.environ["TRIGGER_TAG"]
          release_url = os.environ["RELEASE_URL"]
          body = os.environ["RELEASE_BODY"] + "\n\nRelease artifacts are available on GitHub."
          if len(body) > 3800:
              body = body[:3797] + "…"
          payload = {
              "username": "slskdN Releases",
              "embeds": [
                  {
                      "title": f"slskdN {version} is live",
                      "url": release_url,
                      "description": body,
                      "fields": [
                          {"name": "Build tag", "value": trigger_tag, "inline": True},
                          {"name": "Workflow", "value": os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"], "inline": True},
                      ],
                  }
              ],
          }
          print(json.dumps(payload))
          PY
          then
            echo "Discord announcement failed; release artifacts are already published, continuing."
          fi

      - name: Post Matrix announcement
        env:
          MATRIX_RELEASE_ACCESS_TOKEN: ${{ secrets.TIMEWAYS_MATRIX_RELEASE_TOKEN }}
          MATRIX_BASE_URL: https://matrix.timeways.net
          MATRIX_ROOM_ID: '!feVqoCPCPPaCQmTCEE:timeways.net'
          MATRIX_PROJECT_KEY: slskdn-main
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.parse.outputs.version }}
          VERSION: ${{ needs.parse.outputs.version }}
          TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "$MATRIX_RELEASE_ACCESS_TOKEN" ]; then
            echo "TIMEWAYS_MATRIX_RELEASE_TOKEN is not configured; skipping Matrix announcement."
            exit 0
          fi

          today_utc="$(date -u +%F)"
          marker="releasebot-project:${MATRIX_PROJECT_KEY}"
          sync_filter="$(jq -cn --arg room "$MATRIX_ROOM_ID" '{"room":{"rooms":[ $room ],"timeline":{"limit":50}}}')"
          sync_filter_encoded="$(SYNC_FILTER="$sync_filter" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SYNC_FILTER"], safe=""))')"

          if ! sync_response="$(
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
              "${MATRIX_BASE_URL}/_matrix/client/r0/sync?timeout=0&filter=${sync_filter_encoded}"
          )"; then
            echo "Matrix announcement sync lookup failed; continuing without redacting previous announcements."
            sync_response=""
          fi

          previous_event_id="$(
            printf '%s' "$sync_response" |
              jq -r \
                --arg room "$MATRIX_ROOM_ID" \
                --arg marker "$marker" \
                --arg today "$today_utc" \
                '
                  [.rooms.join[$room].timeline.events[]?
                    | select(.sender == "@releasebot:timeways.net")
                    | select(.type == "m.room.message")
                    | select((.content.formatted_body // "") | contains($marker))
                    | select((.origin_server_ts / 1000 | strftime("%F")) == $today)
                  ]
                  | sort_by(.origin_server_ts)
                  | last
                  | .event_id // empty
                '
          )"

          if [ -n "$previous_event_id" ]; then
            redact_txn="redact-${MATRIX_PROJECT_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            curl --fail --silent --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 60 \
              -X PUT \
              -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"reason":"Superseded by newer release announcement"}' \
              "${MATRIX_BASE_URL}/_matrix/client/r0/rooms/%21feVqoCPCPPaCQmTCEE%3Atimeways.net/redact/${previous_event_id}/${redact_txn}" ||
              echo "Matrix previous-announcement redaction failed; continuing."
          fi

          payload="$(jq -cn \
            --arg body "🔋 slskdN stable release published\nVersion: ${VERSION}\nBuild tag: ${TRIGGER_TAG}\nRelease: ${RELEASE_URL}" \
            --arg html "<p>🔋 slskdN stable release published<br>Version: <code>${VERSION}</code><br>Build tag: <code>${TRIGGER_TAG}</code><br>Release: <a href=\"${RELEASE_URL}\">${RELEASE_URL}</a></p><!-- ${marker} -->" \
            '{
              msgtype: "m.text",
              body: $body,
              format: "org.matrix.custom.html",
              formatted_body: $html
            }'
          )"

          txn_id="${MATRIX_PROJECT_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if ! curl --fail --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 60 \
            -X PUT \
            -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${MATRIX_BASE_URL}/_matrix/client/r0/rooms/%21feVqoCPCPPaCQmTCEE%3Atimeways.net/send/m.room.message/${txn_id}"; then
            echo "Matrix announcement failed; release artifacts are already published, continuing."
          fi

  aur-main:
    name: Publish to AUR (Main - Source & Binary)
    needs: [parse, release-main]
    if: always() && needs.parse.outputs.channel == 'main' && ((github.event_name == 'workflow_dispatch' && inputs.retry_aur) || (github.event_name != 'workflow_dispatch' && needs.release-main.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.info.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get commit info
        id: info
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download binary for slskdn-bin package
          gh release download "${{ needs.parse.outputs.version }}" \
            --repo ${{ github.repository }} \
            --pattern "slskdn-main-linux-glibc-x64.zip"

      - name: Setup SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "⚠️ AUR_SSH_KEY not configured, skipping AUR publish"
            exit 0
          fi
          
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          
          cat >> ~/.ssh/config << EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF
          
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      # Publish slskdn (source package)
      - name: Clone AUR Package (Source)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi

          bash packaging/scripts/checkout-aur-repo.sh slskdn aur-pkg-source

      - name: Update PKGBUILD (Source)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi

          # Compute sha256 for static files; tarball (index 0) is always SKIP
          SVC_SUM=$(sha256sum packaging/aur/slskd.service  | awk '{print $1}')
          YML_SUM=$(sha256sum packaging/aur/slskd.yml      | awk '{print $1}')
          SYS_SUM=$(sha256sum packaging/aur/slskd.sysusers | awk '{print $1}')
          TMP_SUM=$(sha256sum packaging/aur/slskd.tmpfiles | awk '{print $1}')

          cd aur-pkg-source

          # Copy the main source PKGBUILD template
          cp ../packaging/aur/PKGBUILD PKGBUILD
          cp ../packaging/aur/slskd.install slskd.install
          cp ../packaging/aur/slskd.service slskd.service
          cp ../packaging/aur/slskd.yml slskd.yml
          cp ../packaging/aur/slskd.sysusers slskd.sysusers
          cp ../packaging/aur/slskd.tmpfiles slskd.tmpfiles

          # Version for main (convert dots if needed, e.g. 0.25.0)
          ARCH_VERSION=$(echo "${{ needs.parse.outputs.version }}" | sed 's/-/./g')

          # Update version and static file hashes (tarball stays SKIP)
          # source=() order: tarball slskd.service slskd.yml slskd.sysusers slskd.tmpfiles
          sed -i "s/^pkgver=.*/pkgver=${ARCH_VERSION}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP' '${SVC_SUM}' '${YML_SUM}' '${SYS_SUM}' '${TMP_SUM}')/" PKGBUILD
          bash ../packaging/scripts/validate-aur-pkgbuild-hashes.sh PKGBUILD
          
          # Generate .SRCINFO
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c "
            pacman -Sy --noconfirm pacman-contrib
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          "
          
          sudo chown -R $(id -u):$(id -g) .
          
          echo "📝 Updated PKGBUILD (source):"
          cat PKGBUILD | head -30

      - name: Push to AUR (Source)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi
          
          cd aur-pkg-source
          git add PKGBUILD .SRCINFO slskd.install slskd.service slskd.yml slskd.sysusers slskd.tmpfiles
          bash ../packaging/scripts/push-aur-repo.sh . slskdn "Update to ${{ needs.parse.outputs.version }}"

      # Publish slskdn-bin (binary package)
      - name: Clone AUR Package (Binary)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi

          bash packaging/scripts/checkout-aur-repo.sh slskdn-bin aur-pkg-bin

      - name: Update PKGBUILD (Binary)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi

          # Keep the release zip on SKIP for AUR. GitHub release assets are mutable on reruns,
          # and pinning a binary checksum here makes installs brittle across replaced assets/caches.
          SVC_SUM=$(sha256sum packaging/aur/slskd.service  | awk '{print $1}')
          YML_SUM=$(sha256sum packaging/aur/slskd.yml      | awk '{print $1}')
          SYS_SUM=$(sha256sum packaging/aur/slskd.sysusers | awk '{print $1}')
          TMP_SUM=$(sha256sum packaging/aur/slskd.tmpfiles | awk '{print $1}')
          echo "slskd.service: $SVC_SUM"
          echo "slskd.yml    : $YML_SUM"
          echo "slskd.sysusers: $SYS_SUM"
          echo "slskd.tmpfiles: $TMP_SUM"

          cd aur-pkg-bin

          # Copy the binary PKGBUILD template
          cp ../packaging/aur/PKGBUILD-bin PKGBUILD
          cp ../packaging/aur/slskd.install slskd.install
          cp ../packaging/aur/slskd.service slskd.service
          cp ../packaging/aur/slskd.yml slskd.yml
          cp ../packaging/aur/slskd.sysusers slskd.sysusers
          cp ../packaging/aur/slskd.tmpfiles slskd.tmpfiles

          # Version for main
          ARCH_VERSION=$(echo "${{ needs.parse.outputs.version }}" | sed 's/-/./g')

          # Update version and static file hashes only.
          # source=() order: zip slskd.service slskd.yml slskd.sysusers slskd.tmpfiles
          sed -i "s/^pkgver=.*/pkgver=${ARCH_VERSION}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('SKIP' '${SVC_SUM}' '${YML_SUM}' '${SYS_SUM}' '${TMP_SUM}')/" PKGBUILD
          bash ../packaging/scripts/validate-aur-pkgbuild-hashes.sh PKGBUILD
          
          # Generate .SRCINFO
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel bash -c "
            pacman -Sy --noconfirm pacman-contrib
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c 'makepkg --printsrcinfo' > .SRCINFO
          "
          
          sudo chown -R $(id -u):$(id -g) .
          
          echo "📝 Updated PKGBUILD (binary):"
          cat PKGBUILD | head -30

      - name: Push to AUR (Binary)
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then exit 0; fi
          
          cd aur-pkg-bin
          git add PKGBUILD .SRCINFO slskd.install slskd.service slskd.yml slskd.sysusers slskd.tmpfiles
          bash ../packaging/scripts/push-aur-repo.sh . slskdn-bin "Update to ${{ needs.parse.outputs.version }}"

  copr-main:
    name: Publish to COPR (Main)
    needs: [parse, release-main]
    if: always() && needs.parse.outputs.channel == 'main' && ((github.event_name == 'workflow_dispatch' && inputs.retry_copr) || (github.event_name != 'workflow_dispatch' && needs.release-main.result == 'success'))
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.parse.outputs.version }}" \
            --repo ${{ github.repository }} \
            --pattern "slskdn-main-linux-glibc-x64.zip"

      - name: Setup RPM Build
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates krb5-user krb5-k5tls krb5-pkinit libkrb5-dev oathtool python3-pip rpm
          pip3 install copr-cli rich requests-gssapi
          rpm_top="$(mktemp -d "/tmp/slskdn-rpmbuild-${{ needs.parse.outputs.version }}.XXXXXX")"
          mkdir -p "$rpm_top"/{SOURCES,SPECS,SRPMS}
          echo "SLSKDN_RPM_TOP=$rpm_top" >> "$GITHUB_ENV"

      - name: Prepare Sources
        run: |
          # Copy the built zip to SOURCES
          cp slskdn-main-linux-glibc-x64.zip "$SLSKDN_RPM_TOP/SOURCES/"
          
          # Copy supporting files
          cp packaging/aur/slskd.service "$SLSKDN_RPM_TOP/SOURCES/"
          cp packaging/aur/slskd.yml "$SLSKDN_RPM_TOP/SOURCES/"
          cp packaging/aur/slskd.sysusers "$SLSKDN_RPM_TOP/SOURCES/slskd.conf"
          cp packaging/aur/slskd.tmpfiles "$SLSKDN_RPM_TOP/SOURCES/"
          # CI uses SLSKDN_RPM_TOP; local fallback: cp packaging/aur/slskd.tmpfiles ~/rpmbuild/SOURCES/

      - name: Update Spec File
        run: |
          # Use the main spec template
          cp packaging/rpm/slskdn.spec "$SLSKDN_RPM_TOP/SPECS/"
          
          # Convert version for RPM (replace ALL hyphens with dots)
          RPM_VERSION=$(echo "${{ needs.parse.outputs.version }}" | sed 's/-/./g')
          
          # Update version
          sed -i "s/^Version:.*/Version:        ${RPM_VERSION}/" "$SLSKDN_RPM_TOP/SPECS/slskdn.spec"
          sed -i "s|^Source0:.*|Source0:        slskdn-main-linux-glibc-x64.zip|" "$SLSKDN_RPM_TOP/SPECS/slskdn.spec"
          
          cat "$SLSKDN_RPM_TOP/SPECS/slskdn.spec" | head -30

      - name: Configure COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config

          configure_fedora_kerberos() {
            sudo install -d -m 0755 /etc/pki/ipa
            curl -fsSL https://id.fedoraproject.org/ipa/config/ca.crt | sudo tee /etc/pki/ipa/fedoraproject_ipa_ca.crt >/dev/null
            sudo install -d -m 0755 /etc/krb5.conf.d
            if ! grep -Eq '^[[:space:]]*includedir[[:space:]]+/etc/krb5.conf.d/?[[:space:]]*$' /etc/krb5.conf; then
              sudo sed -i '1iincludedir /etc/krb5.conf.d/' /etc/krb5.conf
            fi
            sudo tee /etc/krb5.conf.d/fedoraproject_org >/dev/null <<'EOF'
          [realms]
           FEDORAPROJECT.ORG = {
            kdc = https://id.fedoraproject.org/KdcProxy
            pkinit_anchors = FILE:/etc/pki/ipa/fedoraproject_ipa_ca.crt
           }

          [domain_realm]
           .fedoraproject.org = FEDORAPROJECT.ORG
           fedoraproject.org = FEDORAPROJECT.ORG
           .fedorainfracloud.org = FEDORAPROJECT.ORG
           fedorainfracloud.org = FEDORAPROJECT.ORG
          EOF
            sudo sed -i '/^\[libdefaults\]/a\  dns_lookup_realm = false\n  rdns = false\n  dns_canonicalize_hostname = false' /etc/krb5.conf
          }

          if [[ -n "${COPR_LOGIN:-}" && -n "${COPR_TOKEN:-}" ]]; then
            echo "Configuring COPR with API token credentials."
            cat > ~/.config/copr << EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = slskdn
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          elif [[ -n "${COPR_KERBEROS_PRINCIPAL:-}" && -n "${COPR_KERBEROS_KEYTAB_B64:-}" ]]; then
            echo "Configuring COPR with Kerberos keytab credentials."
            configure_fedora_kerberos

            keytab="$RUNNER_TEMP/copr.keytab"
            ccache="$RUNNER_TEMP/copr.krb5cc"
            printf '%s' "$COPR_KERBEROS_KEYTAB_B64" | base64 -d > "$keytab"
            chmod 0600 "$keytab"
            KRB5CCNAME="FILE:$ccache" kinit -kt "$keytab" "$COPR_KERBEROS_PRINCIPAL"
            rm -f "$keytab"
            echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
            cat > ~/.config/copr << EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
          elif [[ -n "${COPR_FEDORA_USERNAME:-}" && -n "${COPR_FEDORA_PASSWORD:-}" && -n "${COPR_FEDORA_OTP_SECRET:-}" ]]; then
            echo "Configuring COPR with Fedora Kerberos password+OTP credentials."
            configure_fedora_kerberos
            ccache="$RUNNER_TEMP/copr.krb5cc"
            armor="$RUNNER_TEMP/copr.krb5cc.armor"
            otp="$(oathtool --totp --base32 "$COPR_FEDORA_OTP_SECRET")"
            KRB5CCNAME="FILE:$armor" kinit -n @FEDORAPROJECT.ORG
            printf '%s%s\n' "$COPR_FEDORA_PASSWORD" "$otp" \
              | KRB5CCNAME="FILE:$ccache" kinit -T "FILE:$armor" "${COPR_FEDORA_USERNAME}@FEDORAPROJECT.ORG"
            KRB5CCNAME="FILE:$armor" kdestroy || true
            echo "KRB5CCNAME=FILE:$ccache" >> "$GITHUB_ENV"
            cat > ~/.config/copr << EOF
          [copr-cli]
          username = slskdn
          copr_url = https://copr.fedorainfracloud.org
          gssapi = true
          EOF
          else
            echo "COPR credentials not configured. Skipping."
          fi

      - name: Build SRPM
        run: |
          set -euo pipefail
          rpm_version="$(echo "${{ needs.parse.outputs.version }}" | sed 's/-/./g')"
          rpmbuild -bs "$SLSKDN_RPM_TOP/SPECS/slskdn.spec" --define "_topdir $SLSKDN_RPM_TOP"
          
          srpm="$SLSKDN_RPM_TOP/SRPMS/slskdn-${rpm_version}-1.src.rpm"
          test -f "$srpm"
          mkdir -p dist
          cp "$srpm" "dist/slskdn-${rpm_version}-1.src.rpm"
          echo "Built SRPM: dist/slskdn-${rpm_version}-1.src.rpm"
          rpm -qpl "dist/slskdn-${rpm_version}-1.src.rpm" | head -20
          echo "SRPM_PATH=dist/slskdn-${rpm_version}-1.src.rpm" >> "$GITHUB_ENV"

      - name: Upload to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_KERBEROS_PRINCIPAL: ${{ secrets.COPR_KERBEROS_PRINCIPAL }}
          COPR_KERBEROS_KEYTAB_B64: ${{ secrets.COPR_KERBEROS_KEYTAB_B64 }}
          COPR_FEDORA_USERNAME: ${{ secrets.COPR_FEDORA_USERNAME }}
          COPR_FEDORA_PASSWORD: ${{ secrets.COPR_FEDORA_PASSWORD }}
          COPR_FEDORA_OTP_SECRET: ${{ secrets.COPR_FEDORA_OTP_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${COPR_KERBEROS_PRINCIPAL:-}" || -z "${COPR_KERBEROS_KEYTAB_B64:-}" ]] \
            && [[ -z "${COPR_FEDORA_USERNAME:-}" || -z "${COPR_FEDORA_PASSWORD:-}" || -z "${COPR_FEDORA_OTP_SECRET:-}" ]] \
            && [[ -z "${COPR_LOGIN:-}" || -z "${COPR_TOKEN:-}" ]]; then
            echo "Skipping COPR upload - credentials not configured"
            exit 0
          fi

          copr_project="slskdn/slskdn"
          srpm="${SRPM_PATH:?Build SRPM step did not publish an SRPM path}"
          test -f "$srpm"
          echo "Uploading SRPM to COPR: $srpm"
          for attempt in 1 2 3; do
            if copr-cli --debug build "$copr_project" "$srpm" --nowait; then
              echo "✅ Uploaded to COPR: $copr_project"
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "COPR upload failed after $attempt attempts." >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 15))
            echo "COPR upload attempt $attempt failed; retrying in ${sleep_seconds}s." >&2
            sleep "$sleep_seconds"
          done

  ppa-main:
    name: Publish to PPA (Main)
    needs: [parse, release-main]
    if: always() && needs.parse.outputs.channel == 'main' && ((github.event_name == 'workflow_dispatch' && inputs.retry_ppa) || (github.event_name != 'workflow_dispatch' && needs.release-main.result == 'success'))
    continue-on-error: true
    runs-on: ubuntu-latest
    concurrency:
      group: slskdn-ppa-jammy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.parse.outputs.version }}" \
            --repo ${{ github.repository }} \
            --pattern "slskdn-main-linux-glibc-x64.zip"
          unzip slskdn-main-linux-glibc-x64.zip -d publish-linux-x64

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper gnupg build-essential patchelf

      - name: Import and verify PPA signing key
        id: ppa-signing-key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: scripts/import-ppa-signing-key.sh

      - name: Prepare Source Structure
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          
          # Create proper directory structure for debian packaging
          mkdir -p slskdn-${VERSION}/usr/lib/slskd
          mkdir -p slskdn-${VERSION}/lib/systemd/system
          mkdir -p slskdn-${VERSION}/etc/slskd
          mkdir -p slskdn-${VERSION}/usr/lib/sysusers.d
          mkdir -p slskdn-${VERSION}/usr/lib/tmpfiles.d
          
          # Copy binary files from our build
          cp -r publish-linux-x64/* slskdn-${VERSION}/usr/lib/slskd/
          
          # Copy service files from packaging
          cp packaging/aur/slskd.service slskdn-${VERSION}/lib/systemd/system/
          cp packaging/aur/slskd.yml slskdn-${VERSION}/etc/slskd/
          cp packaging/aur/slskd.sysusers slskdn-${VERSION}/usr/lib/sysusers.d/slskd.conf
          cp packaging/aur/slskd.tmpfiles slskdn-${VERSION}/usr/lib/tmpfiles.d/slskd.conf

      - name: Prepare Source Package
        id: ppa-package
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          # Convert version for Debian (replace ALL hyphens with dots)
          DEB_VERSION=$(echo "$VERSION" | sed 's/-/./g')
          
          # Create tarball for orig source
          tar -czvf slskdn_${DEB_VERSION}.orig.tar.gz slskdn-${VERSION}
          
          # Copy debian directory for stable package
          cp -r packaging/debian slskdn-${VERSION}/
          
          # Update control file for slskdn stable package
          cd slskdn-${VERSION}
          
          # Use timestamp-based PPA revision
          PPA_REV=$(date +%Y%m%d%H%M)
          PPA_VERSION="${DEB_VERSION}-1ppa${PPA_REV}~jammy"
          echo "version=$PPA_VERSION" >> "$GITHUB_OUTPUT"
          
          # Update changelog for slskdn stable (use DEB_VERSION with dots)
          cat > debian/changelog << EOF
          slskdn (${PPA_VERSION}) jammy; urgency=medium

            * Stable release
            * Multi-source swarm downloads
            * DHT mesh network
            * Enhanced security features

           -- slskdn <slskdn@proton.me>  $(date -R)
          EOF

      - name: Build Source Package
        if: steps.ppa-signing-key.outputs.fingerprint != ''
        env:
          GPG_SIGNING_FINGERPRINT: ${{ steps.ppa-signing-key.outputs.fingerprint }}
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          cd slskdn-${VERSION}
          debuild -S -sa -d -k"$GPG_SIGNING_FINGERPRINT"

      - name: Preflight Launchpad PPA Upload
        env:
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
        run: |
          if [ -n "$LAUNCHPAD_SFTP_KEY" ]; then
            LAUNCHPAD_PPA_SFTP_IPV4=$(getent ahostsv4 ppa.launchpad.net | awk '$2 == "STREAM" { print $1; exit }')
            if [ -z "$LAUNCHPAD_PPA_SFTP_IPV4" ]; then
              echo "::warning::Unable to resolve an IPv4 address for ppa.launchpad.net SFTP; trying FTP fallback"
              getent ahosts ppa.launchpad.net || true
            else

              echo "Pinning ppa.launchpad.net to IPv4 ${LAUNCHPAD_PPA_SFTP_IPV4} for PPA SFTP upload"
              echo "${LAUNCHPAD_PPA_SFTP_IPV4} ppa.launchpad.net" | sudo tee -a /etc/hosts
              getent ahosts ppa.launchpad.net

              if python3 - <<'PY'
          import socket

          with socket.create_connection(("ppa.launchpad.net", 22), timeout=120) as sock:
              print(f"Connected to {sock.getpeername()[0]}:{sock.getpeername()[1]} over SSH")
          PY
              then
                echo "SLSKDN_PPA_UPLOAD_METHOD=sftp" >> "$GITHUB_ENV"
                exit 0
              fi

              echo "::warning::Launchpad PPA SFTP endpoint is not reachable; trying FTP fallback"
            fi
          fi

          LAUNCHPAD_PPA_FTP_IPV4=$(getent ahostsv4 ppa.launchpad.net | awk '$2 == "STREAM" { print $1; exit }')
          if [ -z "$LAUNCHPAD_PPA_FTP_IPV4" ]; then
            echo "::error::Unable to resolve an IPv4 address for ppa.launchpad.net"
            getent ahosts ppa.launchpad.net || true
            exit 1
          fi

          echo "Pinning ppa.launchpad.net to IPv4 ${LAUNCHPAD_PPA_FTP_IPV4} for PPA FTP upload"
          echo "${LAUNCHPAD_PPA_FTP_IPV4} ppa.launchpad.net" | sudo tee -a /etc/hosts
          getent ahosts ppa.launchpad.net

          if ! python3 - <<'PY'
          import socket

          with socket.create_connection(("ppa.launchpad.net", 21), timeout=120) as sock:
              print(f"Connected to {sock.getpeername()[0]}:{sock.getpeername()[1]}")
          PY
          then
            echo "::error::Launchpad PPA FTP endpoint is not reachable over IPv4"
            exit 1
          fi
          echo "SLSKDN_PPA_UPLOAD_METHOD=ftp" >> "$GITHUB_ENV"

      - name: Upload to PPA
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          LAUNCHPAD_SFTP_KEY: ${{ secrets.LAUNCHPAD_SFTP_KEY }}
          LAUNCHPAD_SFTP_USER: ${{ secrets.LAUNCHPAD_SFTP_USER }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Skipping PPA upload - GPG_PRIVATE_KEY not configured"
            exit 0
          fi
          LAUNCHPAD_SFTP_USER="${LAUNCHPAD_SFTP_USER:-keefshape}"
          ls -la *.changes || true
          CHANGES_FILE=$(find . -name "slskdn_*.changes" -type f | head -1)
          echo "Found changes file: $CHANGES_FILE"

          gpg --verify "$CHANGES_FILE"
          DSC_FILE=$(awk '/\.dsc$/ { print $NF; exit }' "$CHANGES_FILE")
          if [ -z "$DSC_FILE" ] || [ ! -f "$DSC_FILE" ]; then
            echo "::error::Unable to find signed .dsc referenced by $CHANGES_FILE"
            exit 1
          fi
          gpg --verify "$DSC_FILE"

          mapfile -t SOURCE_FILES < <(
            awk '
              /^Files:/ { in_files = 1; next }
              in_files && /^[A-Za-z0-9-]+:/ { in_files = 0 }
              in_files && NF >= 5 { print $5 }
            ' "$CHANGES_FILE"
          )

          if [ "${#SOURCE_FILES[@]}" -eq 0 ]; then
            echo "::error::No source files found in $CHANGES_FILE"
            exit 1
          fi

          uploaded=0
          if [ "${SLSKDN_PPA_UPLOAD_METHOD:-ftp}" = "sftp" ] && [ -n "$LAUNCHPAD_SFTP_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$LAUNCHPAD_SFTP_KEY" > ~/.ssh/launchpad_ppa
            chmod 600 ~/.ssh/launchpad_ppa
            ssh-keyscan -T 30 -t rsa,ecdsa,ed25519 ppa.launchpad.net >> ~/.ssh/known_hosts 2>/dev/null || true
            cat >> ~/.ssh/config << EOF
          Host ppa.launchpad.net
            HostName ppa.launchpad.net
            User ${LAUNCHPAD_SFTP_USER}
            IdentityFile ~/.ssh/launchpad_ppa
            IdentitiesOnly yes
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
            NumberOfPasswordPrompts 0
            StrictHostKeyChecking accept-new
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF

            cat > ~/.dput.cf << EOF
          [slskdn-ppa-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~keefshape/ubuntu/slskdn/
          login = ${LAUNCHPAD_SFTP_USER}
          allow_unsigned_uploads = 0
          EOF

            echo "Uploading $(basename "$CHANGES_FILE") to Launchpad PPA over SFTP"
            if timeout --preserve-status 1800 dput --config ~/.dput.cf slskdn-ppa-sftp "$CHANGES_FILE"; then
              uploaded=1
            else
              echo "::warning::Launchpad SFTP upload failed; trying anonymous FTP fallback"
            fi
          fi

          if [ "$uploaded" -ne 1 ]; then
            cat > ~/.dput.cf << 'EOF'
          [slskdn-ppa-ftp]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~keefshape/ubuntu/slskdn/
          passive_ftp = 1
          login = anonymous
          allow_unsigned_uploads = 0
          EOF

            echo "Uploading $(basename "$CHANGES_FILE") to Launchpad PPA over anonymous FTP"
            timeout --preserve-status 1800 dput --config ~/.dput.cf slskdn-ppa-ftp "$CHANGES_FILE"
          fi

          echo "✅ Uploaded to PPA: slskdn"

      - name: Wait for PPA Publication
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "Skipping PPA publication wait - GPG_PRIVATE_KEY not configured"
            exit 0
          fi
          scripts/wait-for-launchpad-ppa-publication.sh \
            "${{ steps.ppa-package.outputs.version }}" jammy

  docker-main:
    name: Build and Push Docker (Main)
    needs: [parse, release-main]
    if: always() && needs.parse.outputs.channel == 'main' && ((github.event_name == 'workflow_dispatch' && inputs.retry_docker) || (github.event_name != 'workflow_dispatch' && needs.release-main.result == 'success'))
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: snapetech/slskdn
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ needs.parse.outputs.version }}" \
            --repo ${{ github.repository }} \
            --pattern "slskdn-main-linux-glibc-x64.zip"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker Tags
        id: docker_tags
        run: |
          {
            echo 'tags<<EOF'
            echo 'ghcr.io/snapetech/slskdn:${{ needs.parse.outputs.version }}'
            echo 'ghcr.io/snapetech/slskdn:latest'
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:${{ needs.parse.outputs.version }}"
              echo "${DOCKERHUB_IMAGE}:latest"
            else
              echo "Docker Hub secrets are not configured; publishing GHCR tags only." >&2
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Main Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.parse.outputs.version }}
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "✅ Published Docker images:"
          echo "  - ghcr.io/snapetech/slskdn:${{ needs.parse.outputs.version }}"
          echo "  - ghcr.io/snapetech/slskdn:latest"
          if [ "${HAS_DOCKERHUB}" = "true" ]; then
            echo "  - ${DOCKERHUB_IMAGE}:${{ needs.parse.outputs.version }}"
            echo "  - ${DOCKERHUB_IMAGE}:latest"
          else
            echo "  - Docker Hub skipped; configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to enable it."
          fi

  docker-omnibus:
