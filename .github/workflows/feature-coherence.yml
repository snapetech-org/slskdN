# ng-runner-policy: private-jit-only-v1
name: Feature coherence audit

on:
  push:
    tags:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-audit"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run feature coherence audit
        run: bash scripts/audit-feature-coherence.sh

      - name: Run README maturity draft audit
        run: bash scripts/audit-readme-maturity-draft.sh

      - name: Run roadmap claim audit
        run: bash scripts/audit-roadmap-claims.sh
