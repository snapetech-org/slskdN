name: Feature coherence audit

on:
  pull_request:
    paths:
      - README.md
      - README.maturity.md
      - FEATURE_INVENTORY.md
      - docs/status.md
      - docs/security/**
      - docs/dependencies.md
      - docs/analyzer-suppressions.md
      - scripts/audit-feature-coherence.sh
      - scripts/audit-readme-maturity-draft.sh
      - scripts/audit-roadmap-claims.sh
      - src/slskd/slskd.csproj
  push:
    branches:
      - chore/feature-coherence-audit
    paths:
      - README.md
      - README.maturity.md
      - FEATURE_INVENTORY.md
      - docs/status.md
      - docs/security/**
      - docs/dependencies.md
      - docs/analyzer-suppressions.md
      - scripts/audit-feature-coherence.sh
      - scripts/audit-readme-maturity-draft.sh
      - scripts/audit-roadmap-claims.sh
      - src/slskd/slskd.csproj

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run feature coherence audit
        run: bash scripts/audit-feature-coherence.sh

      - name: Run README maturity draft audit
        run: bash scripts/audit-readme-maturity-draft.sh

      - name: Run roadmap claim audit
        run: bash scripts/audit-roadmap-claims.sh
