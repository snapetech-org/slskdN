# ng-runner-policy: hosted-first-v1
name: Trivy filesystem scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "13 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ng-scan-trivy-filesystem-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy source, dependency, and configuration scan
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Trivy release
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # latest
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan applicable repository files
        run: ./scripts/security-scan-local.sh --trivy-only --ci

