name: Semgrep Community Edition

on:
  push:
  pull_request:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-ce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep CE (community rules)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e EIO_BACKEND=posix \
            -e HTTP_PROXY -e HTTPS_PROXY -e http_proxy -e https_proxy \
            -e NO_PROXY -e no_proxy \
            -e REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review semgrep.sarif and the scan log."' semgrep.json

      # Semgrep marks precise in-source nosemgrep suppressions as accepted; omit those from active GitHub alerts.
      - name: Filter inline-suppressed SARIF results
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          jq '
            .runs |= map(
              .results |= map(select(((.suppressions // []) | any(.state == "accepted")) | not))
            )
          ' semgrep.sarif > semgrep-upload.sarif
          jq -r '[.runs[].results[]?] | length' semgrep-upload.sarif

      - name: Upload findings to GitHub code scanning
        if: >-
          always() && hashFiles('semgrep-upload.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep-upload.sarif
          category: semgrep-ce-community
