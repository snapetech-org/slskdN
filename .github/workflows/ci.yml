# ng-runner-policy: private-jit-only-v1
name: CI
run-name: ${{ github.event_name == 'pull_request' && 'action:ci:pool:private' || (github.event_name == 'workflow_dispatch' && format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag)) || github.workflow }}
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-slskdn.*"
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        required: true
        type: choice
        options: [ci]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        required: true
        type: choice
        options: [private]
      pr_number:
        description: Same-repository owner pull request number
        required: false
        type: string
      pr_sha:
        description: Exact pull request head SHA
        required: false
        type: string
      target_run_id:
        description: Metadata-only label event run ID
        required: false
        type: string
      pr_author:
        description: Pull request author from the metadata event
        required: false
        type: string
      pr_repository:
        description: Pull request head repository from the metadata event
        required: false
        type: string
      pr_branch:
        description: Pull request head branch from the metadata event
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [labeled]

concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.402'
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
jobs:
  build:
    name: Build and Test
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.action_tag == 'ci' &&
        inputs.runner_pool_tag == 'private' &&
        (
          (github.actor == 'snapetech' &&
           github.ref == 'refs/heads/main' &&
           inputs.pr_number == '' && inputs.pr_sha == '' &&
           inputs.target_run_id == '' && inputs.pr_author == '' &&
           inputs.pr_repository == '' && inputs.pr_branch == '') ||
          (github.actor == 'github-actions[bot]' &&
           inputs.pr_number != '' && inputs.pr_sha != '' &&
           inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
           inputs.pr_repository == github.repository &&
           inputs.pr_branch != '' &&
           github.ref == format('refs/heads/{0}', inputs.pr_branch) &&
           github.sha == inputs.pr_sha)
        )
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install ripgrep when unavailable
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Verify validation tools
        run: |
          command -v jq
          command -v rg

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Web workspace
        run: pnpm install --frozen-lockfile

      - name: Build Web workspace
        run: pnpm --filter @slskdn/web build

      - name: Check Web bundle budget
        run: pnpm --filter @slskdn/web check:bundle

      - name: Setup Soulfind (Docker)
        run: |
          # Pull Soulfind Docker image for protocol contract tests
          # Image: ghcr.io/soulfind-dev/soulfind (official Soulseek server simulator)
          docker pull ghcr.io/soulfind-dev/soulfind:latest || echo "Soulfind image not available - protocol tests will skip"
        continue-on-error: true

      - name: Set Environment Variables
        id: version
        run: |
          # Get the latest slskdn release tag only (not build-trigger tags like build-main-*)
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^([0-9]+\.[0-9]+\.[0-9]+|[0-9]{8,10})-slskdn\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(sed -n 's#.*<version>\(.*\)</version>#\1#p' packaging/chocolatey/slskdn.nuspec | head -n1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG='0.24.0-slskdn.1'
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PATCH=0
          else
            PATCH=65534
          fi
          BUILD_VERSION="${LATEST_TAG}.${PATCH}+$(git rev-parse --short HEAD)"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      - name: NuGet Vulnerability Scan
        run: |
          set -euo pipefail
          python3 scripts/check-nuget-vulnerabilities.py

      - name: AUR sha256sum Consistency Check
        run: |
          bash packaging/scripts/validate-aur-pkgbuild-hashes.sh \
            packaging/aur/PKGBUILD \
            packaging/aur/PKGBUILD-bin

      - name: Changelog Discipline Check
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          bash scripts/validate-changelog-entry.sh \
            range \
            "origin/${BASE_REF}" \
            "${HEAD_SHA}"

      - name: Release Gate
        run: bash packaging/scripts/run-release-gate.sh

      - name: Upload Static Web Content
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-content
          path: src/web/build

  nix-smoke:
    name: Nix Package Smoke
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.action_tag == 'ci' &&
        inputs.runner_pool_tag == 'private' &&
        (
          (github.actor == 'snapetech' &&
           github.ref == 'refs/heads/main' &&
           inputs.pr_number == '' && inputs.pr_sha == '' &&
           inputs.target_run_id == '' && inputs.pr_author == '' &&
           inputs.pr_repository == '' && inputs.pr_branch == '') ||
          (github.actor == 'github-actions[bot]' &&
           inputs.pr_number != '' && inputs.pr_sha != '' &&
           inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
           inputs.pr_repository == github.repository &&
           inputs.pr_branch != '' &&
           github.ref == format('refs/heads/{0}', inputs.pr_branch) &&
           github.sha == inputs.pr_sha)
        )
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Nix package smoke
        run: bash packaging/scripts/run-nix-package-smoke.sh
  
  publish:
    name: Publish
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-{1}-publish"]}}', github.run_id, strategy.job-index)) }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - "win-x64"
          - "win-arm64"
          - "linux-x64"
          - "linux-arm"
          - "linux-arm64"
          - "linux-musl-x64"
          - "linux-musl-arm"
          - "linux-musl-arm64"
          - "osx-x64"
          - "osx-arm64"
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set Environment Variables
        run: |
          echo "BUILD_VERSION=${{ needs.build.outputs.version }}" >> $GITHUB_ENV

      - name: Download Static Web Content
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-content
          path: src/slskd/wwwroot

      - name: Build ${{ matrix.runtime }}
        run: bin/publish --no-prebuild --runtime ${{ matrix.runtime }} --version ${{ env.BUILD_VERSION }}

      - name: Upload Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slskdn-${{ env.BUILD_VERSION }}-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}
  
  docker:
    name: Build Docker Image
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-docker"]}}', github.run_id)) }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    env:
      DOCKERHUB_IMAGE: snapetech/slskdn
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # docker tags aren't compatible with semver, therefore + can't be used to delimit the version and SHA
      # https://github.com/opencontainers/distribution-spec/issues/154
      # CONTAINER_VERSION is used in Docker tags and must use a hyphen (-) delimiter between the tag and SHA
      # APP_VERSION is passed as a Docker build arg and used to publish the app and must use a hyphen (-) for NuGet compatibility
      - name: Set Environment Variables
        run: |
          # Get the latest slskdn tag only
          TAG=$(git tag --sort=-version:refname | grep -E '^([0-9]+\.[0-9]+\.[0-9]+|[0-9]{8,10})-slskdn\.[0-9]+$' | head -n1)
          if [ -z "$TAG" ]; then
            TAG=$(sed -n 's#.*<version>\(.*\)</version>#\1#p' packaging/chocolatey/slskdn.nuspec | head -n1)
          fi
          if [ -z "$TAG" ]; then
            TAG='0.24.0-slskdn.1'
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "CONTAINER_VERSION=${TAG}.$([[ $GITHUB_REF = refs/tags/* ]] && echo 0 || echo 65534)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "APP_VERSION=${TAG}.$([[ $GITHUB_REF = refs/tags/* ]] && echo 0 || echo 65534)-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date --iso-8601=s)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Require Docker Hub publisher credentials for stable releases
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Docker Hub publisher credentials are required for stable image aliases.' >&2
            exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker Tags
        id: docker_tags
        run: |
          {
            echo 'canary_tags<<EOF'
            echo "ghcr.io/snapetech-org/slskdn:${CONTAINER_VERSION}"
            echo 'ghcr.io/snapetech-org/slskdn:canary'
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:${CONTAINER_VERSION}"
              echo "${DOCKERHUB_IMAGE}:canary"
            else
              echo "Docker Hub secrets are not configured; publishing GHCR tags only." >&2
            fi
            echo 'EOF'
            echo 'release_tags<<EOF'
            echo "ghcr.io/snapetech-org/slskdn:${CONTAINER_VERSION}"
            echo "ghcr.io/snapetech-org/slskdn:${TAG}"
            echo 'ghcr.io/snapetech-org/slskdn:canary'
            echo 'ghcr.io/snapetech-org/slskdn:latest'
            echo 'ghcr.io/snapetech-org/slskdn:main'
            echo 'ghcr.io/snapetech-org/slskdn:master'
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:${CONTAINER_VERSION}"
              echo "${DOCKERHUB_IMAGE}:${TAG}"
              echo "${DOCKERHUB_IMAGE}:canary"
              echo "${DOCKERHUB_IMAGE}:latest"
              echo "${DOCKERHUB_IMAGE}:main"
              echo "${DOCKERHUB_IMAGE}:master"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Canary
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/snapetech-org/slskdN
          build-args: |
            TAG=${{ env.TAG }}
            VERSION=${{ env.APP_VERSION }}
            REVISION=${{ env.REVISION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: ${{ steps.docker_tags.outputs.canary_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/snapetech-org/slskdN
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          tags: ${{ steps.docker_tags.outputs.release_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    needs: [build, publish, docker]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set Environment Variables
        run: |
          echo "TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "BUILD_VERSION=${{ needs.build.outputs.version }}" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: slskdn-*

      - name: Prepare Release Assets
        run: |
          mkdir -p release
          for dir in artifacts/slskdn-*; do
            runtime=$(basename "$dir" | sed "s/slskdn-${{ env.BUILD_VERSION }}-//")
            echo "Processing $runtime..."
            cd "$dir"
            if [ -f "slskd" ]; then
              chmod +x slskd
            fi
            zip -r "../../release/slskdn-${{ env.TAG }}-$runtime.zip" .
            cd ../..
          done
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Package Workflows
        run: |
          echo "Triggering package builds for ${{ env.TAG }}..."
          gh workflow run release-linux.yml -f tag=${{ env.TAG }}
          gh workflow run release-copr.yml -f tag=${{ env.TAG }}
          gh workflow run release-ppa.yml -f tag=${{ env.TAG }}
          gh workflow run release-packages.yml -f tag=${{ env.TAG }}
          echo "All package workflows triggered!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch exact pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          expected = "snapetech-org/slskdN"
          workflow = "ci.yml"
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"].lower()
          branch = os.environ["PR_BRANCH"]
          author = os.environ["PR_AUTHOR"]
          head_repo = os.environ["PR_REPOSITORY"]
          target = os.environ["TARGET_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          if (repository.lower() != expected.lower() or head_repo.lower() != expected.lower()
                  or author != "snapetech" or not re.fullmatch(r"[1-9][0-9]*", number)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or not re.fullmatch(r"[1-9][0-9]*", target) or not branch
                  or subprocess.run(["git","check-ref-format","--branch",branch],
                                    stdout=subprocess.DEVNULL,check=False).returncode != 0):
              raise SystemExit("invalid trusted owner PR metadata")
          payload = json.dumps({"ref":branch,"inputs":{
              "action_tag":"ci","runner_pool_tag":"private","pr_number":number,
              "pr_sha":sha,"target_run_id":target,"pr_author":author,
              "pr_repository":head_repo,"pr_branch":branch}}).encode()
          request = Request(
              f"https://api.github.com/repos/{expected}/actions/workflows/{workflow}/dispatches",
              data=payload,
              headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}",
                       "Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urlopen(request, timeout=20) as response:
              if response.status not in {200,204}:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          PY

  report-owner-pr:
    name: Report trusted owner PR validation
    needs: [build, nix-smoke]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      inputs.pr_number != '' && inputs.pr_sha != '' &&
      inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
      inputs.pr_repository == github.repository &&
      inputs.pr_branch != '' &&
      github.ref == format('refs/heads/{0}', inputs.pr_branch)
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
      pull-requests: read
    steps:
      - name: Attach exact-head validation result
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: snapetech-org/slskdN
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_REPOSITORY: ${{ inputs.pr_repository }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          JOB_RESULTS: '{"build":"${{ needs.build.result }},"nix-smoke":"${{ needs.nix-smoke.result }}}'
          CHECK_NAME: slskdN owner PR validation
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          repo = os.environ["EXPECTED_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"].lower()
          branch = os.environ["PR_BRANCH"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["VALIDATION_RUN_ID"]
          target = os.environ["TARGET_RUN_ID"]
          results = json.loads(os.environ["JOB_RESULTS"])
          if (os.environ["GITHUB_REPOSITORY"].lower() != repo.lower()
                  or os.environ["PR_REPOSITORY"].lower() != repo.lower()
                  or os.environ["PR_AUTHOR"] != "snapetech"
                  or not re.fullmatch(r"[1-9][0-9]*", number)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or not re.fullmatch(r"[1-9][0-9]*", run_id)
                  or not re.fullmatch(r"[1-9][0-9]*", target) or not results):
              raise SystemExit("invalid owner PR validation metadata")
          headers = {"Accept":"application/vnd.github+json",
                     "Authorization":f"Bearer {token}",
                     "X-GitHub-Api-Version":"2022-11-28"}
          request = Request(f"https://api.github.com/repos/{repo}/pulls/{number}", headers=headers)
          with urlopen(request, timeout=20) as response:
              pr = json.load(response)
          head_repo = (pr.get("head",{}).get("repo") or {}).get("full_name","")
          current = (pr.get("state") == "open" and pr.get("user",{}).get("login") == "snapetech"
                     and pr.get("base",{}).get("ref") == "main"
                     and head_repo.lower() == repo.lower()
                     and pr.get("head",{}).get("ref") == branch
                     and pr.get("head",{}).get("sha","").lower() == sha
                     and os.environ["GITHUB_SHA"].lower() == sha)
          success = current and all(v == "success" for v in results.values())
          cancelled = any(v == "cancelled" for v in results.values())
          conclusion = "success" if success else ("cancelled" if cancelled else "failure")
          details = [f"- {name}: {value}" for name,value in results.items()]
          if not current: details.append("- PR head or ownership changed; result is stale.")
          summary = "Exact-head private-JIT owner PR validation.\n\n" + "\n".join(details)
          payload = json.dumps({
              "name":os.environ["CHECK_NAME"],"head_sha":sha,
              "external_id":f"{target}:{run_id}","status":"completed",
              "conclusion":conclusion,
              "details_url":f"https://github.com/{repo}/actions/runs/{run_id}",
              "output":{"title":f"Owner PR validation {conclusion}","summary":summary}
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/check-runs",data=payload,
                            headers={**headers,"Content-Type":"application/json"},method="POST")
          with urlopen(request, timeout=20) as response:
              if response.status not in {201,202}:
                  raise SystemExit(f"check-run API returned HTTP {response.status}")
          PY
