# ng-runner-policy: hosted-first-v1
name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id) || github.workflow }}
on:
  push:
    branches: [ main ]
    # Release builds are handled only by build-on-tag.yml on v<version> tags.
  pull_request:
    branches: [ main ]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:

      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

env:
  DOTNET_VERSION: '10.0.402'
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
jobs:
  build:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    name: Build and Test
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest')) }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Configure runner temporary storage
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || "$RUNNER_TEMP" != /* || "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* || ! -d "$RUNNER_TEMP" || ! -r "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" || ! -x "$RUNNER_TEMP" ]]; then
            printf 'RUNNER_TEMP must be an absolute writable directory\n' >&2
            exit 1
          fi
          runner_temp_resolved="$(cd -- "$RUNNER_TEMP" && pwd -P)"
          case "$runner_temp_resolved" in
            /|/tmp|/tmp/*|/var/tmp|/var/tmp/*)
              printf 'RUNNER_TEMP must not resolve under a shared temporary directory\n' >&2
              exit 1
              ;;
          esac
          if [[ "$runner_temp_resolved" == *$'\n'* || "$runner_temp_resolved" == *$'\r'* ]]; then
            printf 'RUNNER_TEMP must not contain line breaks\n' >&2
            exit 1
          fi
          : "${GITHUB_ENV:?GITHUB_ENV is required}"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$runner_temp_resolved" "$runner_temp_resolved" "$runner_temp_resolved" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
          persist-credentials: false
      - name: Install ripgrep when unavailable
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi

      - name: Verify validation tools
        run: |
          command -v jq
          command -v rg

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 12.4.1
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ inputs.pr_number == '' }}
          node-version: '22.23.4'
          cache: ${{ inputs.pr_number == '' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Web workspace
        run: pnpm install --frozen-lockfile

      - name: Build Web workspace
        run: pnpm --filter @slskdn/web build

      - name: Check Web bundle budget
        run: pnpm --filter @slskdn/web check:bundle

      - name: Setup Soulfind (Docker)
        run: |
          # Pull Soulfind Docker image for protocol contract tests
          # Image: ghcr.io/soulfind-dev/soulfind (official Soulseek server simulator)
          docker pull ghcr.io/soulfind-dev/soulfind:latest || echo "Soulfind image not available - protocol tests will skip"
        continue-on-error: true

      - name: Set Environment Variables
        id: version
        run: |
          # Normalize canonical v<version> tags while retaining old published tags.
          LATEST_TAG=$(git tag | sed 's/^v//' | grep -E '^([0-9]+\.[0-9]+\.[0-9]+|[0-9]{8,10})-slskdn\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(sed -n 's#.*<version>\(.*\)</version>#\1#p' packaging/chocolatey/slskdn.nuspec | head -n1)
          fi
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG='0.24.0-slskdn.1'
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            PATCH=0
          else
            PATCH=65534
          fi
          BUILD_VERSION="${LATEST_TAG}.${PATCH}+$(git rev-parse --short HEAD)"
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT

      - name: NuGet Vulnerability Scan
        run: |
          set -euo pipefail
          python3 scripts/check-nuget-vulnerabilities.py

      - name: AUR sha256sum Consistency Check
        run: |
          bash packaging/scripts/validate-aur-pkgbuild-hashes.sh \
            packaging/aur/PKGBUILD \
            packaging/aur/PKGBUILD-bin

      - name: Changelog Discipline Check
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot') || (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main')
        env:
          BASE_REF: ${{ inputs.pr_number != '' && 'main' || github.base_ref }}
          HEAD_SHA: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
        run: |
          bash scripts/validate-changelog-entry.sh \
            range \
            "origin/${BASE_REF}" \
            "${HEAD_SHA}"

      - name: Release Gate
        run: bash packaging/scripts/run-release-gate.sh

      - name: Upload Static Web Content
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-content
          path: src/web/build

  nix-smoke:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    name: Nix Package Smoke
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-nix-smoke"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run Nix package smoke
        run: bash packaging/scripts/run-nix-package-smoke.sh

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.actor == 'snapetech' && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.ref == 'main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          expected='snapetech-org/slskdN'
          repository=os.environ['GITHUB_REPOSITORY'];number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();target=os.environ['TARGET_RUN_ID'];token=os.environ['GH_TOKEN']
          if repository.lower()!=expected.lower() or not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not re.fullmatch(r'[1-9][0-9]*',target):raise SystemExit('invalid PR claim')
          payload=json.dumps({"ref": "main", "inputs": {"pr_number": number, "pr_sha": sha, "target_run_id": target}}).encode()
          request=Request(
            'https://api.github.com/repos/snapetech-org/slskdN/actions/workflows/ci.yml/dispatches',
            data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status!=204:raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [build, nix-smoke]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slskdn","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULTS: '{"build":"${{ needs.build.result }}","nix-smoke":"${{ needs.nix-smoke.result }}"}'
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();results=json.loads(os.environ['VALIDATION_RESULTS'])
          if not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not results:raise SystemExit('invalid PR check claim')
          conclusion='success' if all(v=='success' for v in results.values()) else 'failure'
          summary='Main-pinned, no-secret owner PR validation:\n'+'\n'.join(f'- {n}: {v}' for n,v in results.items())
          run_id=os.environ['VALIDATION_RUN_ID']
          payload=json.dumps({"name": "slskdN owner PR validation", "head_sha": sha, "external_id": run_id, "status": "completed", "conclusion": conclusion, "details_url": "https://github.com/snapetech-org/slskdN/actions/runs/" + run_id, "output": {"title": "Owner PR validation " + conclusion, "summary": summary}}).encode()
          request=Request('https://api.github.com/repos/snapetech-org/slskdN/check-runs',data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status not in {201,202}:raise SystemExit(f'check HTTP {response.status}')
          PY
