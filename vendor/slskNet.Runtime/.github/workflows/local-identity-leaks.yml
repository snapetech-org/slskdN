# ng-runner-policy: private-jit-only-v1
name: Local Identity Leak Check

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the private security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]
jobs:
  local-identity-leaks:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slsknet.runtime","ng-main-run-{0}","gha-{0}-local-identity-leaks"]}}', github.run_id)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install scanner dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep

      - name: Check release-facing text
        env:
          LOCAL_IDENTITY_DENYLIST: ${{ secrets.LOCAL_IDENTITY_DENYLIST }}
          LOCAL_IDENTITY_SCAN_COMMITS: "1"
        run: bash scripts/check-local-identity-leaks.sh
