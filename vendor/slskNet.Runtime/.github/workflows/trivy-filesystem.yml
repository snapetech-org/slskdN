# ng-runner-policy: private-jit-only-v1
name: Trivy filesystem scan

run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}

on:
  workflow_dispatch:

    inputs:
      action:
        description: Run the private security scan
        required: true
        type: choice
        options:
          - scan
      runner_pool:
        description: Select the private ephemeral runner pool
        required: true
        type: choice
        options: [private]
permissions:
  contents: read

concurrency:
  group: trivy-fs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trivy:
    name: Trivy source, dependency, and configuration scan
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.action == 'scan' && inputs.runner_pool == 'private' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slsknet.runtime","ng-main-run-{0}","gha-{0}-trivy"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Trivy release
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # pinned commit
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan applicable repository files
        run: ./scripts/security-scan-local.sh --trivy-only --ci
