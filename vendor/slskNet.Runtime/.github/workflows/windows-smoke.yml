# packer-windows-jit-v1
# ng-runner-policy: private-jit-only-v1
name: Windows Smoke


run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag) ||
      format('action:{0}:pool:{1}', inputs.action_tag || 'ci', inputs.runner_pool_tag || 'private') }}

on:
  pull_request_target:
    types: [labeled]
    branches: [main]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "*.sln"
      - ".github/workflows/windows-smoke.yml"
  workflow_dispatch:
    inputs:
      action_tag:
        description: Required workflow action tag
        type: choice
        options: [ci]
        required: true
      runner_pool_tag:
        description: Required private JIT runner pool tag
        type: choice
        options: [private]
        required: true
      pr_number:
        description: Trusted owner PR number set by the metadata-only dispatcher
        type: string
        required: false
      pr_sha:
        description: Exact trusted owner PR head SHA
        type: string
        required: false
      target_run_id:
        description: Metadata-only pull_request_target run ID
        type: string
        required: false
      pr_author:
        description: PR author copied from the metadata-only event
        type: string
        required: false
      pr_repository:
        description: PR head repository copied from the metadata-only event
        type: string
        required: false
permissions:
  contents: read

jobs:
  dotnet:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      ((github.actor == 'snapetech' && inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '' && inputs.pr_author == '' && inputs.pr_repository == '') ||
       (github.actor == 'github-actions[bot]' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository))
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","on-demand","packer-windows","slskNet.Runtime","gha-{0}-dotnet"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Restore
        run: dotnet restore slskNet.Runtime.sln

      - name: Build
        run: dotnet build slskNet.Runtime.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test slskNet.Runtime.sln --configuration Release --no-build

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 - <<'ROUTE_VALIDATION_PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"]
          pr_repository = os.environ["PR_REPOSITORY"]
          pr_author = os.environ["PR_AUTHOR"]
          target_run_id = os.environ["TARGET_RUN_ID"]
          labels = json.loads(os.environ["PR_LABELS_JSON"])
          action_labels = [label for label in labels if isinstance(label, str) and label.startswith("action:")]
          pool_labels = [label for label in labels if isinstance(label, str) and label.startswith("pool:")]
          if action_labels != ["action:ci"] or pool_labels != ["pool:private"]:
              raise SystemExit("add exactly action:ci and pool:private labels")
          if repository != "snapetech-org/slskNet.Runtime":
              raise SystemExit("unexpected repository")
          if os.environ["GITHUB_REPOSITORY_ID"] != os.environ["PR_REPOSITORY_ID"]:
              raise SystemExit("pull request head repository ID does not match this repository")
          if pr_author != "snapetech" or pr_repository.lower() != repository.lower():
              raise SystemExit("private validation only accepts the repository owner's pull requests")
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("invalid pull request number")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", target_run_id):
              raise SystemExit("invalid metadata run ID")

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "action_tag": "ci",
                  "runner_pool_tag": "private",
                  "pr_number": number,
                  "pr_sha": sha,
                  "target_run_id": target_run_id,
                  "pr_author": pr_author,
                  "pr_repository": pr_repository,
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/slskNet.Runtime/actions/workflows/windows-smoke.yml/dispatches",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          ROUTE_VALIDATION_PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [dotnet]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      inputs.pr_author == 'snapetech' && inputs.pr_repository == github.repository &&
      inputs.action_tag == 'ci' && inputs.runner_pool_tag == 'private' &&
      github.actor == 'github-actions[bot]'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-slsknet.runtime","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'failure' || 'success' }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'OWNER_PR_REPORTER_PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          sha = os.environ["PR_SHA"]
          result = os.environ["VALIDATION_RESULT"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid pull request head SHA")
          conclusion = "success" if result == "success" else ("cancelled" if result == "cancelled" else "failure")
          run_id = os.environ["VALIDATION_RUN_ID"]
          payload = json.dumps({
              "name": "slskNet.Runtime Windows smoke owner PR",
              "head_sha": sha,
              "external_id": run_id,
              "status": "completed",
              "conclusion": conclusion,
              "details_url": f"https://github.com/snapetech-org/slskNet.Runtime/actions/runs/{run_id}",
              "output": {
                  "title": "slskNet.Runtime Windows smoke owner PR " + conclusion,
                  "summary": "See the linked main-pinned workflow run for validation details.",
              },
          }).encode("utf-8")
          request = Request(
              "https://api.github.com/repos/snapetech-org/slskNet.Runtime/check-runs",
              data=payload,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urlopen(request, timeout=20) as response:
              if response.status not in {201, 202}:
                  raise SystemExit(f"check creation returned HTTP {response.status}")
          OWNER_PR_REPORTER_PY
